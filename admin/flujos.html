<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujos de trámites · Wiener Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
    .flow-node { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 150px; text-align: center; position: relative; }
    .flow-node b { font-size: 13.5px; display: block; }
    .flow-node span { font-size: 11.5px; color: var(--text-muted); }
    .flow-node.start { background: var(--brand-soft); border-color: var(--brand); }
    .flow-node.end { background: var(--purple-bg); border-color: #d8b4fe; }
    .flow-arrow { display: flex; align-items: center; color: var(--text-muted); padding: 0 10px; font-size: 20px; }
    .flow-stage-pay { background: var(--info-bg); border-color: var(--info-bd); }
    .resp-list { display:flex; flex-direction:column; gap:10px; }
    .resp-item { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--border-soft); border-radius:10px; }
  </style>
</head>
<body>
  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    const ctx = APP.renderShell('flujos');

    function nodes(t) {
      const pago = `<div class="flow-node flow-stage-pay"><b>Pago (Niubiz)</b><span>${APP.money(t.costo)}</span></div>`;
      const arrow = `<div class="flow-arrow">→</div>`;
      const sol = `<div class="flow-node start"><b>Solicitud</b><span>Alumno</span></div>`;
      const rev = `<div class="flow-node"><b>Revisión</b><span>${t.area}</span></div>`;
      const apr = t.requiereAprobacion ? `${arrow}<div class="flow-node"><b>Aprobación</b><span>Administrativo</span></div>` : '';
      const fin = `<div class="flow-node end"><b>Emisión</b><span>${t.diasEntrega} días háb.</span></div>`;
      if (t.pagoMomento === 'antes')
        return `<div class="flow">${sol}${arrow}${pago}${arrow}${rev}${apr}${arrow}${fin}</div>`;
      return `<div class="flow">${sol}${arrow}${rev}${apr}${arrow}${pago}${arrow}${fin}</div>`;
    }

    function render() {
      const ts = DB.tramites();
      const cards = ts.map(t => `
        <div class="card" style="margin-bottom:18px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px">
            <div><div class="card-title">${t.nombre}</div>
            <div class="card-sub" style="margin:0">${t.tipo} · pago ${t.pagoMomento} · ${t.requiereAprobacion ? 'con aprobación' : 'automático'}</div></div>
            <span class="pill ${t.activo ? 'ok' : 'gray'}">${t.activo ? 'Activo' : 'Inactivo'}</span>
          </div>
          ${nodes(t)}
        </div>`).join('');

      ctx.mount.innerHTML = `
        <div class="page-head"><div><h1>Flujos de trámites</h1><p>Visualiza las etapas de cada trámite: solicitud, pago, revisión, aprobación y emisión.</p></div></div>

        <div class="card" style="margin-bottom:22px">
          <div class="card-title">Configuración global de etapas</div>
          <div class="card-sub">Define los responsables por defecto de cada etapa del flujo.</div>
          <div class="resp-list">
            <div class="resp-item"><div><b>1. Recepción de solicitud</b><br><span class="muted">Generada por el alumno desde la intranet</span></div><span class="tag teal">Automático</span></div>
            <div class="resp-item"><div><b>2. Validación de pago (Niubiz)</b><br><span class="muted">Confirmación de la pasarela de pagos</span></div><span class="tag">Pasarela Niubiz</span></div>
            <div class="resp-item"><div><b>3. Revisión documentaria</b><br><span class="muted">Verificación de requisitos por el área</span></div><span class="tag">Área responsable</span></div>
            <div class="resp-item"><div><b>4. Aprobación / rechazo</b><br><span class="muted">Decisión y notificación por correo</span></div><span class="tag">Administrativo</span></div>
            <div class="resp-item"><div><b>5. Emisión y entrega</b><br><span class="muted">Generación del documento y aviso al alumno</span></div><span class="tag">Registros</span></div>
          </div>
        </div>

        <div class="section-label">Flujo por trámite</div>
        ${cards}
      `;
    }
    render();
  </script>
</body>
</html>
