    // Genera registros complementarios para alcanzar exactamente los 70 mostrados en la captura
    (function completarRegistros() {
      const carreras = [
        'INGENIERÍA INDUSTRIAL Y DE GESTIÓN EMPRESARIAL', 'INGENIERÍA DE SISTEMAS E INFORMÁTICA',
        'DERECHO Y CIENCIA POLÍTICA', 'CONTABILIDAD Y AUDITORÍA', 'OBSTETRICIA', 'ADMINISTRACIÓN Y MARKETING',
        'ADMINISTRACIÓN Y DIRECCIÓN DE EMPRESAS', 'PSICOLOGÍA', 'ENFERMERÍA', 'ODONTOLOGÍA', 'MEDICINA HUMANA'
      ];
      const apellidos = ['GARCIA', 'RODRIGUEZ', 'MARTINEZ', 'LOPEZ', 'SANCHEZ', 'PEREZ', 'GOMEZ', 'FLORES', 'DIAZ', 'VASQUEZ', 'CASTRO', 'ROMERO', 'SUAREZ', 'HERRERA', 'MEDINA', 'AGUILAR', 'RAMOS'];
      const nombres = ['JUAN CARLOS', 'ANA LUCIA', 'MIGUEL ANGEL', 'KAREN SOFIA', 'DIEGO ALEXANDER', 'VALERIA PAOLA', 'CRISTIAN JAVIER', 'MARIA ISABEL', 'JORGE LUIS', 'ANDREA NICOLE'];
      
      const list = DATA_REPORTES['cambio-presencial'];
      let currentLen = list.length;
      for (let i = currentLen + 1; i <= 70; i++) {
        const ap1 = apellidos[i % apellidos.length];
        const ap2 = apellidos[(i + 3) % apellidos.length];
        const nom = nombres[i % nombres.length];
        const car = carreras[i % carreras.length];
        const dia = String(Math.min(28, (i % 25) + 1)).padStart(2, '0');
        const mes = String(Math.floor(i / 15) + 1).padStart(2, '0');
        list.push({
          nro: i,
          ticket: '2026.' + (2680 + i),
          codigo: '202' + (i % 5) + '10' + String(1000 + i),
          alumno: ap1 + ' ' + ap2 + ' ' + nom,
          carrera: car,
          estado: (i % 7 === 0) ? 'SOLICITADO' : 'APROBADO',
          fecha: `${dia}/${mes}/2026`,
          hora: `${String((i % 12) + 1).padStart(2, '0')}:${String((i * 7) % 60).padStart(2, '0')}:15 ${(i % 2 === 0 ? 'PM' : 'AM')}`,
          matricula: 'Matriculado',
          modalidad: (i % 3 === 0) ? 'SEMIPRESENCIAL' : 'PRESENCIAL',
          condicion: (i % 4 === 0) ? 'REINCORPORADO' : 'PROMOVIDO'
        });
      }
    })();

    function exportarExcelCSV() {
      if (!currentReportKey) {
        APP.toast({ icon: '⚠️', title: 'Sin reporte', body: 'Selecciona un reporte institucional primero.' });
        return;
      }
      const rep = REPORTES_CONFIG[currentReportKey];
      const rows = DATA_REPORTES[currentReportKey] || [];
      const headers = ['N°', 'Ticket', 'Código Alumno', 'Nombres y Apellidos', 'Carrera', 'Estado', 'Fecha Registro', 'Hora Registro', 'Estado Matrícula', 'Modalidad Estudios', 'Condición'];
      
      const csvRows = rows.map(r => [
        r.nro,
        `"${r.ticket}"`,
        `"${r.codigo}"`,
        `"${r.alumno}"`,
        `"${r.carrera}"`,
        `"${r.estado}"`,
        `"${r.fecha}"`,
        `"${r.hora}"`,
        `"${r.matricula}"`,
        `"${r.modalidad}"`,
        `"${r.condicion}"`
      ].join(','));

      const csvContent = '\uFEFF' + [headers.join(','), ...csvRows].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `reporte_${currentReportKey}_${filtroDesde}_a_${filtroHasta}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      APP.toast({
        icon: '📥',
        title: 'Exportación completada',
        body: `Se descargó el archivo con ${rows.length} registros.`
      });
    }

    function renderCatalogCards() {
      const cards = Object.values(REPORTES_CONFIG).map(r => {
        const isActive = currentReportKey === r.id;
        return `
          <div class="report-card ${isActive ? 'report-card-active' : ''}" style="margin:0">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
                <span class="catalog-tag">${r.categoria}</span>
                <span style="font-size:11.5px;color:var(--text-muted)">${r.area}</span>
              </div>
              <h3 style="font-size:15px;font-weight:700;color:var(--text);margin:0 0 6px 0;line-height:1.35">${r.titulo}</h3>
              <p style="font-size:12.5px;color:var(--text-muted);line-height:1.45;margin:0 0 10px 0">${r.descripcion}</p>
              <div style="font-size:12px;color:var(--text-soft)">
                <span>Formato: <b>${r.formato}</b></span> · <span><b>${r.totalMuestra}</b> registros aprox.</span>
              </div>
            </div>
            <div style="margin-top:14px;display:flex;gap:8px">
              <button class="btn btn-primary btn-sm" style="flex:1" onclick="seleccionarReporteDesdeCard('${r.id}')">
                ${isActive ? '✓ Reporte en pantalla' : 'Consultar este reporte'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="catalog-drawer ${(!showCatalog && currentReportKey) ? 'hidden' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <div>
              <h3 style="font-family:'Lato',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin:0">
                Catálogo de Reportes Institucionales Disponibles
              </h3>
              <p style="font-size:13px;color:var(--text-muted);margin:2px 0 0 0">
                Haz clic en <b>'Consultar este reporte'</b> para cargar automáticamente los filtros y visualizar los datos en la tabla.
              </p>
            </div>
            ${currentReportKey ? `
              <button class="btn btn-outline btn-sm" onclick="toggleCatalog()">
                ✕ Ocultar catálogo
              </button>
            ` : ''}
          </div>
          <div class="reports-grid" style="margin-top:0">
            ${cards}
          </div>
        </div>
      `;
    }

    function renderPagination(curr, total) {

      for (let p = 1; p <= total; p++) {
        if (total > 7) {
          if (p > 1 && p < curr - 1 && p === 2) { btns += '<span style="padding:0 4px;color:var(--text-muted)">...</span>'; continue; }
          if (p > 1 && p < curr - 1) continue;
          if (p < total && p > curr + 1 && p === total - 1) { btns += '<span style="padding:0 4px;color:var(--text-muted)">...</span>'; continue; }
          if (p < total && p > curr + 1) continue;
        }
        btns += `<button class="vt-page-btn ${p === curr ? 'active' : ''}" onclick="cambiarPagina(${p})">${p}</button>`;
      }

      return `
        <div class="vt-pagination">
          <button class="vt-page-btn" ${curr <= 1 ? 'disabled' : ''} onclick="cambiarPagina(${curr - 1})" title="Página anterior">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Anterior</span>
          </button>
          ${btns}
          <button class="vt-page-btn" ${curr >= total ? 'disabled' : ''} onclick="cambiarPagina(${curr + 1})" title="Página siguiente">
            <span>Siguiente</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      `;
    }

    function render() {
      const activeReport = REPORTES_CONFIG[currentReportKey];
      const rawRows = (currentReportKey && DATA_REPORTES[currentReportKey]) || [];

      // Filtro de texto rápido dentro de la tabla
      const filteredRows = rawRows.filter(r => {
        if (!filtroTexto) return true;
        const q = filtroTexto.toLowerCase();
        return (
          r.ticket.toLowerCase().includes(q) ||
          r.codigo.toLowerCase().includes(q) ||
          r.alumno.toLowerCase().includes(q) ||
          r.carrera.toLowerCase().includes(q)
        );
      });

      const totalRegistros = filteredRows.length;
      const totalPaginas = Math.ceil(totalRegistros / registrosPorPagina) || 1;
      const startIdx = (paginaActual - 1) * registrosPorPagina;
      const endIdx = startIdx + registrosPorPagina;
      const paginatedRows = filteredRows.slice(startIdx, endIdx);

      // Renderizado de filas de la tabla
      const rowsHtml = paginatedRows.map(r => {
        // Tag de modalidad según Section 3 de Design.md
        let modCls = 'presencial';
        if (r.modalidad.toUpperCase().includes('SEMI')) modCls = 'semipresencial';
        else if (r.modalidad.toUpperCase().includes('VIRTUAL') || r.modalidad.toUpperCase().includes('DISTANCIA')) modCls = 'distancia';

        // Tag de condición
        let condCls = 'regular';
        if (r.condicion.toUpperCase().includes('PROMOV')) condCls = 'promovido';
        else if (r.condicion.toUpperCase().includes('REINCORP')) condCls = 'reincorporado';

        // Badge de estado
        let estadoBadge = `<span class="pill ok no-dot">${r.estado}</span>`;
        if (r.estado.toUpperCase().includes('SOLIC')) estadoBadge = `<span class="pill info no-dot">${r.estado}</span>`;
        else if (r.estado.toUpperCase().includes('OBSERV')) estadoBadge = `<span class="pill warn no-dot">${r.estado}</span>`;

        return `
          <tr>
            <td class="rep-col-num">${r.nro}</td>
            <td class="rep-col-ticket"><span class="vt-ticket-badge">${r.ticket}</span></td>
            <td class="rep-col-cod"><span class="mono" style="font-weight:600;font-size:12.5px">${r.codigo}</span></td>
            <td class="rep-col-nom"><span style="font-weight:700;color:var(--text)">${r.alumno}</span></td>
            <td class="rep-col-carrera"><span style="font-size:12px;font-weight:500;color:var(--text-soft)">${r.carrera}</span></td>
            <td class="rep-col-estado">${estadoBadge}</td>
            <td class="rep-col-fecha" style="font-size:12px;color:var(--text)">${r.fecha}</td>
            <td class="rep-col-hora" style="font-size:12px;color:var(--text-muted)">${r.hora}</td>
            <td class="rep-col-mat"><span style="font-size:12.5px">${r.matricula}</span></td>
            <td class="rep-col-mod"><span class="modality-pill ${modCls}">${r.modalidad}</span></td>
            <td class="rep-col-cond"><span class="condicion-pill ${condCls}">${r.condicion}</span></td>
          </tr>
        `;
      }).join('');

      ctx.mount.innerHTML = `
        <div class="vt-container">
          <!-- Encabezado de página estandarizado -->
          <div class="page-head">
            <div>
              <h1>Reportes</h1>
              <p>Generación y descarga de padrones y reportes operativos a solicitud de las áreas académicas.</p>
            </div>
            <div style="display:flex;gap:10px;align-items:center">
              <button class="btn btn-outline" onclick="toggleCatalog()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                <span>${showCatalog ? 'Ocultar catálogo' : 'Explorar catálogo de reportes'}</span>
              </button>
            </div>
          </div>

          <!-- Selector Institucional Contextual -->
          <div class="vt-top-meta">
            <div class="vt-inst-selector">
              <span style="font-weight:700;color:var(--brand-dark)">Institución:</span>
              <div class="select-wrap" style="width:auto;min-width:320px;margin:0">
                <select id="sel-inst-reportes" onchange="cambiarInstitucion(this.value)">
                  <option value="Wiener" ${currentInst === 'Wiener' ? 'selected' : ''}>Universidad Privada Norbert Wiener S.A.</option>
                  <option value="Carrion" ${currentInst === 'Carrion' ? 'selected' : ''}>I.E.S. Particular Daniel Alcides Carrión</option>
                </select>
              </div>
              <span class="vt-role-badge">Perfil: Administrador</span>
            </div>
            <div class="vt-clock">
              <span>🕒 Fecha/Hora del sistema: </span><b>${APP.nowStamp()}</b>
            </div>
          </div>

          <!-- FILTROS: Diseño idéntico y consistente con Vista de Trámites -->
          <div class="vt-filter-box">
            <div class="vt-filter-head">
              <div class="vt-filter-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                Filtros de Búsqueda de Reportes
              </div>
              <span style="font-size:12px;color:var(--text-muted)">Selecciona el reporte institucional y las fechas de consulta</span>
            </div>

            <div class="vt-filter-grid" style="grid-template-columns: 2fr 1fr 1fr; align-items: flex-end;">
              <!-- Selector de Reporte -->
              <div class="vt-field">
                <label for="f-reporte">Reporte:</label>
                <div class="select-wrap">
                  <select id="f-reporte" onchange="currentReportKey=this.value;paginaActual=1;render()">
                    <option value="" ${!currentReportKey ? 'selected' : ''}>--- Seleccione ---</option>
                    ${Object.values(REPORTES_CONFIG).map(r => `
                      <option value="${r.id}" ${currentReportKey === r.id ? 'selected' : ''}>${r.titulo}</option>
                    `).join('')}
                  </select>
                </div>
              </div>

              <!-- Fecha Desde -->
              <div class="vt-field">
                <label for="f-desde">Desde:</label>
                <input type="date" id="f-desde" value="${filtroDesde}" onchange="filtroDesde=this.value;paginaActual=1">
              </div>

              <!-- Fecha Hasta -->
              <div class="vt-field">
                <label for="f-hasta">Hasta:</label>
                <input type="date" id="f-hasta" value="${filtroHasta}" onchange="filtroHasta=this.value;paginaActual=1">
              </div>
            </div>

            <!-- Botones Buscar y Exportar con fondo negro institucional -->
            <div class="vt-filter-actions" style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--border-soft);display:flex;justify-content:flex-end;align-items:center;gap:10px;">
              <button class="btn btn-outline" onclick="limpiarFiltrosReportes()">
                Limpiar filtros
              </button>
              ${currentReportKey ? `
                <button class="btn btn-black" onclick="exportarExcelCSV()" title="Exportar resultados a formato Excel / CSV">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                  Exportar
                </button>
              ` : ''}
              <button class="btn btn-black" onclick="paginaActual=1;render()" title="Ejecutar búsqueda">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                Buscar
              </button>
            </div>
          </div>

          <!-- Catálogo Colapsable de Reportes (Opción 1 Híbrida) -->
          ${renderCatalogCards()}

          <!-- Tabla de Resultados (Mostrada al filtrar o tener un reporte seleccionado) -->
          ${currentReportKey ? `
            <div class="vt-table-card">
              <!-- Barra superior con contador exacto de producción -->
              <div class="vt-table-top">
                <div class="vt-counter-text">
                  <span style="font-size:16px;font-weight:700;color:var(--brand-dark)"><b>${totalRegistros}</b> Registro(s)</span>
                  <span style="font-size:12.5px;color:var(--text-muted);margin-left:8px">
                    · Mostrando página <b>${paginaActual}</b> de <b>${totalPaginas}</b>
                    (${startIdx + 1} - ${Math.min(endIdx, totalRegistros)})
                  </span>
                </div>

                <div style="display:flex;align-items:center;gap:14px">
                  <!-- Buscador rápido en tabla -->
                  <div style="position:relative">
                    <input type="text" placeholder="Filtrar por alumno o ticket..." value="${filtroTexto}" oninput="filtroTexto=this.value;paginaActual=1;render()"
                      style="height:34px;padding:0 10px;font-size:12.5px;border:1px solid var(--border);border-radius:6px;width:230px">
                  </div>
                  ${renderPagination(paginaActual, totalPaginas)}
                </div>
              </div>

              <!-- Contenedor con scroll horizontal para 11 columnas -->
              <div class="vt-table-wrapper">
                <table class="vt-table">
                  <thead>
                    <tr>
                      <th class="rep-col-num">N°</th>
                      <th class="rep-col-ticket">Ticket</th>
                      <th class="rep-col-cod">Código Alumno</th>
                      <th class="rep-col-nom">Nombres y Apellidos</th>
                      <th class="rep-col-carrera">Carrera</th>
                      <th class="rep-col-estado">Estado</th>
                      <th class="rep-col-fecha">Fecha Registro</th>
                      <th class="rep-col-hora">Hora Registro</th>
                      <th class="rep-col-mat">Estado Matrícula</th>
                      <th class="rep-col-mod">Modalidad Estudios</th>
                      <th class="rep-col-cond">Condición</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml || `
                      <tr>
                        <td colspan="11" style="text-align:center;padding:48px 20px;color:var(--text-muted)">
                          <div style="font-size:32px;margin-bottom:8px">🔍</div>
                          <div style="font-weight:700;font-size:15px;color:var(--text)">No se encontraron registros en el rango seleccionado</div>
                          <div style="font-size:13px;margin-top:4px">Intenta ajustando el rango de fechas o limpiando el filtro de texto.</div>
                        </td>
                      </tr>
                    `}
                  </tbody>
                </table>
              </div>

              <!-- Pie de tabla con paginación inferior -->
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#F8FAFC;border-top:1px solid var(--border-soft)">
                <span style="font-size:12px;color:var(--text-muted)">
                  Reporte: <b>${activeReport ? activeReport.titulo : '-'}</b>
                </span>
                ${renderPagination(paginaActual, totalPaginas)}
              </div>
            </div>
          ` : `
            <div style="text-align:center;padding:60px 20px;background:#FFFFFF;border:1px solid var(--border);border-radius:12px">
              <div style="font-size:48px;margin-bottom:12px">📋</div>
              <h3 style="font-size:18px;color:var(--text);margin:0 0 8px 0">Selecciona un reporte institucional en los filtros</h3>
              <p style="font-size:13.5px;color:var(--text-muted);max-width:500px;margin:0 auto 16px auto">
                Elige un reporte del menú desplegable superior o explora las fichas técnicas del catálogo para generar y descargar los padrones en Excel / CSV.
              </p>
              <button class="btn btn-outline" onclick="toggleCatalog()">
                Ver catálogo completo de reportes
              </button>
            </div>
          `}
        </div>
      `;

      // Inicializa los desplegables personalizados Wiener
      if (APP && APP.initCustomSelects) {
        APP.initCustomSelects(ctx.mount);
      }
    }

    render();
  </script>
</body>
</html>
