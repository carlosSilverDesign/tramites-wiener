<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de Trámites · Wiener Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Tabs de navegación estilo Wiener */
    .tabs-header {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--border-soft);
      padding-bottom: 4px;
    }
    .tab-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 10px 10px 0 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Lato', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .tab-nav-btn:hover {
      color: var(--brand);
      background: var(--surface-2);
    }
    .tab-nav-btn.active {
      color: var(--brand-dark);
      background: var(--surface);
      border-bottom: 3px solid var(--brand);
      margin-bottom: -6px;
    }
    .tab-nav-btn .count-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text-soft);
    }
    .tab-nav-btn.active .count-badge {
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    /* Barra de filtros y búsqueda */
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text-soft);
      font-weight: 500;
    }
    .filter-input {
      padding: 8px 12px;
      font-size: 13.5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #FFF;
      outline: none;
      min-width: 220px;
    }
    .filter-select {
      padding: 8px 12px;
      font-size: 13.5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #FFF;
      outline: none;
    }

    /* Mini etiquetas y badges */
    .concept-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      color: #334155;
      font-family: monospace;
    }
    .flow-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 1px solid #BFE6E9;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .action-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-icon-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFF;
      color: var(--text-soft);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-icon-action:hover {
      background: var(--surface-2);
      border-color: var(--brand);
      color: var(--brand-dark);
    }
    .btn-icon-action.highlight {
      background: var(--brand-soft);
      border-color: var(--brand);
      color: var(--brand-dark);
    }
    .avatar-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF;
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 3px 9px 3px 4px;
      font-size: 12px;
      margin: 2px 4px 2px 0;
    }
    .avatar-mini {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--brand);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 700;
    }

    /* Tablas modales */
    .modal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }
    .modal-table th {
      background: var(--surface-2);
      padding: 9px 12px;
      text-align: left;
      font-weight: 700;
      color: var(--text-soft);
      border-bottom: 2px solid var(--border);
    }
    .modal-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .modal-table tr:hover td {
      background: #FAFAFA;
    }


    /* Modal Wide con ancho optimizado para evitar cortes de información */
    .modal.wide {
      max-width: 960px !important;
      width: 96% !important;
    }

    /* Switch toggle compacto para tablas */
    .switch.switch-sm {
      width: 36px;
      height: 20px;
      display: inline-block;
      vertical-align: middle;
      margin: 0;
    }
    .switch.switch-sm .slider::before {
      height: 14px;
      width: 14px;
      left: 3px;
      top: 3px;
    }
    .switch.switch-sm input:checked + .slider::before {
      transform: translateX(16px);
    }

    /* Subtabs internas de modales estilo Wiener */
    .modal-subnav {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid var(--border-soft);
      margin-bottom: 20px;
    }
    .modal-subnav-btn {
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      font-family: 'Lato', sans-serif;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-bottom: -2px;
      border-radius: 6px 6px 0 0;
    }
    .modal-subnav-btn svg {
      flex-shrink: 0;
    }
    .modal-subnav-btn:hover {
      color: var(--brand);
      background: var(--surface-2);
    }
    .modal-subnav-btn.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
      background: #FFFFFF;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.03);
    }
    .char-limit-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }
    .search-panel-box {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .btn-circle-del {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
    }
    .btn-circle-del:hover {
      background: #DC2626;
      color: #FFF;
    }
    .btn-circle-add {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
    }
    .btn-circle-add:hover {
      background: #047857;
      color: #FFF;
    }
    .detail-card-info {
      background: #FFF;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }

    /* Botones de acción y jerarquía visual Wiener */
    .btn-dark {
      background: #0F172A;
      border: 1px solid #0F172A;
      color: #FFFFFF;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-dark:hover {
      background: #1E293B;
      border-color: #1E293B;
      color: #FFFFFF;
    }
    .btn-search-bar {
      height: 38px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 8px;
      background: #0F172A;
      border: 1px solid #0F172A;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-search-bar:hover {
      background: #1E293B;
      border-color: #1E293B;
    }
    .btn-new-bar {
      height: 38px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }

    /* Grilla de 4 acciones (2 arriba, 2 abajo) del mismo tamaño + botón eliminar */
    .action-cell-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 74px);
      gap: 4px;
    }
    .btn-grid-act {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 74px;
      height: 27px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-grid-act:hover {
      background: var(--surface-2);
      border-color: var(--brand);
      color: var(--brand-dark);
    }
    .btn-grid-act svg {
      flex-shrink: 0;
      color: var(--brand-dark);
    }
    .btn-grid-del {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 58px;
      border-radius: 6px;
      border: 1px solid #FCA5A5;
      background: #FEE2E2;
      color: #DC2626;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-grid-del:hover {
      background: #FCA5A5;
      color: #991B1B;
    }

    /* Editor de texto enriquecido (RTE) */
    .rte-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #FFF;
    }
    .rte-bar {
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .rte-tool-btn {
      background: #FFF;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      user-select: none;
    }
    .rte-tool-btn:hover {
      background: #E2E8F0;
      color: var(--brand-dark);
    }
    .rte-editor-area {
      width: 100%;
      min-height: 110px;
      padding: 10px 12px;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13.5px;
      resize: vertical;
      line-height: 1.5;
      box-sizing: border-box;
    }

    /* Tarjetas de cronograma sistema de diseño Wiener */
    .cronog-card-wiener {
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      background: #FFFFFF;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }
    .cronog-card-wiener:hover {
      box-shadow: var(--shadow);
    }
  </style>
</head>

    function rteCommand(textareaId, cmd) {
      const ta = document.getElementById(textareaId);
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const sel = ta.value.substring(start, end);
      let rep = '';
      if (cmd === 'bold') rep = `<b>${sel || 'texto en negrita'}</b>`;
      else if (cmd === 'italic') rep = `<i>${sel || 'texto en cursiva'}</i>`;
      else if (cmd === 'underline') rep = `<u>${sel || 'texto subrayado'}</u>`;
      else if (cmd === 'strike') rep = `<s>${sel || 'texto tachado'}</s>`;
      else if (cmd === 'list-ul') rep = `\n• ${sel || 'elemento de lista'}\n`;
      else if (cmd === 'list-ol') rep = `\n1. ${sel || 'elemento numerado'}\n`;
      else if (cmd === 'quote') rep = `\n> ${sel || 'cita'}\n`;
      else if (cmd === 'link') {
        const url = prompt('Ingrese URL del enlace:', 'https://');
        if (url) rep = `<a href="${url}" target="_blank">${sel || 'Enlace'}</a>`;
        else return;
      }
      ta.setRangeText(rep, start, end, 'end');
      ta.focus();
    }

    function updateCharCounter(elId, len, max = 500) {
      const el = document.getElementById(elId);
      if (el) el.textContent = `${len} / ${max} caracteres (máx. ${max})`;
    }

              <span>Palabra:</span>
              <input class="filter-input" id="search-req-kw" placeholder="Buscar requisito..." value="${SEARCH_QUERY}" onkeyup="if(event.key==='Enter') buscarRequisito()">
            </div>
            <div class="filter-item">
              <span>Estado:</span>
              <select class="filter-select" id="filter-req-estado" onchange="buscarRequisito()">
                <option value="todos" ${FILTER_ESTADO === 'todos' ? 'selected' : ''}>Todos</option>
                <option value="activo" ${FILTER_ESTADO === 'activo' ? 'selected' : ''}>Activo</option>
                <option value="inactivo" ${FILTER_ESTADO === 'inactivo' ? 'selected' : ''}>Inactivo</option>
              </select>
            </div>
            <button class="btn btn-search-bar" onclick="buscarRequisito()">${SVG_ICONS.search} <span>Buscar</span></button>
          </div>
          <button class="btn btn-primary btn-new-bar" onclick="editarRequisito(null)">${SVG_ICONS.plus} <span>Nuevo Requisito</span></button>
        </div>

        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th style="width:45px;text-align:center">N°</th>
                <th style="min-width:230px;width:28%">Requisito</th>
                <th style="width:23%">Observación</th>
                <th style="min-width:160px;width:18%">Adjuntar Archivo</th>
                <th style="width:90px;text-align:center">Estado</th>
                <th style="width:120px;text-align:center">Fecha reg.</th>
                <th style="width:145px;text-align:center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows : `<tr><td colspan="7" style="text-align:center;padding:34px;color:var(--text-muted)">No se encontraron requisitos.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="margin-top:12px;font-size:13px;color:var(--text-muted);font-weight:600">${reqs.length} requisito(s) registrado(s)</div>
      `;
    }

    function buscarRequisito() {
      SEARCH_QUERY = document.getElementById('search-req-kw') ? document.getElementById('search-req-kw').value.trim() : '';
      FILTER_ESTADO = document.getElementById('filter-req-estado') ? document.getElementById('filter-req-estado').value : 'todos';
      render();
    }

    // =========================================================================
    // MODAL: REGISTRAR / EDITAR TRÁMITE (Captura 2)
    // =========================================================================
    function editarTramite(id) {
      const t = id ? JSON.parse(JSON.stringify(DB.getTramite(id))) : {
        id: null, codigo: 'T-00' + (DB.tramites().length + 1), nombre: '', tipo: 'Constancia', modelo: 'constancia',
        descripcion: '', conceptoCodigo: '', conceptoServicio: '', costo: 0,
        tiempoVigenciaHrs: 48, plazoRecojoDias: 3, observacion: '',
        tipoActivacion: 'Permanente', envioCorreo: true, activo: true, area: 'Registros Académicos',
        pagoMomento: 'antes', requiereAprobacion: true, diasEntrega: 3,
        audiencia: { niveles: ['pregrado'], ciclos: [], minCreditos: 0, tercioSuperior: false, quintoSuperior: false, promedioMin: 0 },
        requisitos: [], proceso: [], cronogramas: []
      };
      DRAFT = t;
      const areas = DB.areas();
      const a = t.audiencia || { niveles: ['pregrado'], ciclos: [], minCreditos: 0 };
      const pl = DOC.getPlantilla(t);
      const cicloChips = CICLOS.map(c => `<label class="chip-check ${a.ciclos && a.ciclos.includes(c) ? 'checked' : ''}"><input type="checkbox" data-ciclo="${c}" ${a.ciclos && a.ciclos.includes(c) ? 'checked' : ''} onchange="this.closest('.chip-check').classList.toggle('checked',this.checked)">${c}° ciclo</label>`).join('');

      const titLen = (t.nombre || '').length;
      const obsLen = (t.observacion || '').length;

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${SVG_ICONS.edit}
            </div>
            <div>
              <h3>${id ? 'Editar Trámite' : 'Registrar Nuevo Trámite'}</h3>
              <div style="font-size:12px;color:var(--text-muted)">Institución: Universidad Privada Norbert Wiener S.A.</div>
            </div>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>
        <div class="modal-body" style="max-height:80vh;overflow-y:auto">
          
          <div class="form-grid">
            <div class="field full">
              <label>Título: *</label>
              <input class="input" id="t-titulo" maxlength="500" value="${t.nombre || ''}" placeholder="Ej. BECA IMPULSA 30% o CONSTANCIA DE MATRÍCULA" oninput="updateCharCounter('t-tit-count', this.value.length, 500)">
              <div class="char-limit-text" id="t-tit-count">Ingrese como máximo 500 caracteres. (${titLen}/500)</div>
            </div>

            <!-- DESCRIPCIÓN CON EDITOR ENRIQUECIDO -->
            <div class="field full">
              <label>Descripción:</label>
              <div class="rte-box">
                <div class="rte-bar">
                  <button type="button" class="rte-tool-btn" title="Fuente HTML" onclick="rteCommand('t-desc','bold')">&lt;/&gt;</button>
                  <button type="button" class="rte-tool-btn" title="Negrita" onclick="rteCommand('t-desc','bold')"><b>B</b></button>
                  <button type="button" class="rte-tool-btn" title="Cursiva" onclick="rteCommand('t-desc','italic')"><i>I</i></button>
                  <button type="button" class="rte-tool-btn" title="Subrayado" onclick="rteCommand('t-desc','underline')"><u>U</u></button>
                  <button type="button" class="rte-tool-btn" title="Tachado" onclick="rteCommand('t-desc','strike')"><s>S</s></button>
                  <span style="width:1px;height:16px;background:#CBD5E1;margin:0 4px"></span>
                  <button type="button" class="rte-tool-btn" title="Lista con viñetas" onclick="rteCommand('t-desc','list-ul')">•≡</button>
                  <button type="button" class="rte-tool-btn" title="Lista numerada" onclick="rteCommand('t-desc','list-ol')">1≡</button>
                  <button type="button" class="rte-tool-btn" title="Cita" onclick="rteCommand('t-desc','quote')">“ ”</button>
                  <button type="button" class="rte-tool-btn" title="Enlace" onclick="rteCommand('t-desc','link')">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                  </button>
                </div>
                <textarea class="rte-editor-area" id="t-desc" rows="4" placeholder="Ingrese la descripción detallada del trámite...">${t.descripcion || ''}</textarea>
              </div>
            </div>
          </div>

          <!-- CONCEPTO DE CAJA / FACTURACIÓN (Captura 2) -->
          <div style="margin-top:14px;background:#F8FAFC;border:1px solid #CBD5E1;border-radius:10px;padding:14px 16px">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <span style="font-weight:700;font-size:13px;color:var(--text);min-width:65px">Concepto:</span>
              <button class="btn btn-sm" type="button" style="background:#0284C7;color:#FFF;border:1px solid #0369A1;padding:5px 12px;font-weight:700;letter-spacing:1px" onclick="abrirCatalogoConceptos()" title="Seleccionar concepto de caja">...</button>
              <input class="input" id="t-concepto-cod" value="${t.conceptoCodigo || ''}" placeholder="Código" readonly style="width:110px;background:#FFF;font-weight:700;font-family:monospace;color:var(--brand-dark)">
              <input class="input" id="t-concepto-serv" value="${t.conceptoServicio || ''}" placeholder="Servicio contable de facturación" readonly style="flex:1;min-width:220px;background:#FFF;font-weight:600">
            </div>

            <div class="form-grid" style="margin-top:12px">
              <div class="field">
                <label>Costo: S/.</label>
                <input class="input" id="t-costo" type="number" step="0.5" min="0" value="${t.costo || 0}">
              </div>
              <div class="field">
                <label>Tiempo vigencia del trámite(Hrs):</label>
                <input class="input" id="t-vigencia" type="number" min="0" value="${t.tiempoVigenciaHrs || 48}">
              </div>
              <div class="field">
                <label>Plazo Máx. Recojo (Días):</label>
                <input class="input" id="t-recojo" type="number" min="0" value="${t.plazoRecojoDias || 3}">
              </div>
            </div>
          </div>

          <!-- OBSERVACIÓN INSTITUCIONAL -->
          <div class="form-grid" style="margin-top:14px">
            <div class="field full">
              <label>Observación:</label>
              <textarea class="input" id="t-obs" rows="2" maxlength="500" placeholder="Ingrese como máximo 500 caracteres..." oninput="updateCharCounter('t-obs-count', this.value.length, 500)">${t.observacion || ''}</textarea>
              <div class="char-limit-text" id="t-obs-count">Ingrese como máximo 500 caracteres. (${obsLen}/500)</div>
            </div>

            <div class="field">
              <label>Tipo de Activación:</label>
              <select class="select" id="t-tipo-act">
                <option value="Permanente" ${t.tipoActivacion === 'Permanente' ? 'selected' : ''}>Permanente</option>
                <option value="Cronograma" ${t.tipoActivacion === 'Cronograma' ? 'selected' : ''}>Cronograma</option>
              </select>
            </div>
            <div class="field">
              <label>Envio Correo Personalizado:</label>
              <select class="select" id="t-envio-correo">
                <option value="no" ${!t.envioCorreo ? 'selected' : ''}>No</option>
                <option value="si" ${t.envioCorreo ? 'selected' : ''}>Si</option>
              </select>
            </div>
            <div class="field">
              <label>Habilitar:</label>
              <select class="select" id="t-habilitar">
                <option value="si" ${t.activo ? 'selected' : ''}>Si</option>
                <option value="no" ${!t.activo ? 'selected' : ''}>No</option>
              </select>
            </div>
          </div>

          <!-- OPCIONES AVANZADAS: OCULTAS DE MOMENTO SEGÚN REQUERIMIENTO -->
          <div id="opciones-avanzadas-tramite" style="display:none">
            <input type="hidden" id="t-codigo" value="${t.codigo || t.id || 'AUTOGENERADO'}">
            <input type="hidden" id="t-area-resp" value="${t.area || 'Registros Académicos'}">
            <input type="hidden" id="t-pago-momento" value="${t.pagoMomento || 'despues'}">
            <input type="checkbox" id="t-aud-pre" ${a.niveles && a.niveles.includes('pregrado') ? 'checked' : ''}>
            <input type="checkbox" id="t-aud-post" ${a.niveles && a.niveles.includes('postgrado') ? 'checked' : ''}>
            <input type="checkbox" id="t-aud-tercio" ${a.tercioSuperior ? 'checked' : ''}>
            <input type="checkbox" id="t-aud-quinto" ${a.quintoSuperior ? 'checked' : ''}>
            <input type="number" id="t-aud-cred" value="${a.minCreditos || 0}">
            <input type="number" id="t-aud-prom" value="${a.promedioMin || 0}">
            <select id="t-tipo"><option selected>${t.tipo || 'Constancia'}</option></select>
            <select id="t-modelo"><option selected>${t.modelo || 'constancia'}</option></select>
            <input id="p-emisor" value="${pl.emisor || ''}">
            <input id="p-titulo" value="${pl.titulo || ''}">
            <textarea id="p-cuerpo">${pl.cuerpo || ''}</textarea>
            <input id="p-firmante" value="${pl.firmante || ''}">
            <input id="p-cargo" value="${pl.cargo || ''}">
            <div id="chips-ciclos-container">${cicloChips}</div>
          </div>

        </div>
        <div class="modal-foot">
          <button type="button" class="btn" onclick="APP.closeModal()">Cerrar</button>
          <button type="button" class="btn btn-primary" onclick="guardarTramite('${id || ''}')" style="display:inline-flex;align-items:center;gap:6px">
            ${SVG_ICONS.check} Grabar
          </button>
        </div>
      `, { wide: true });
    }

    // Modal selector de conceptos (Captura 4)
    function abrirCatalogoConceptos() {
      const concs = DB.conceptos();
      const rows = concs.map(c => `
        <tr>
          <td style="text-align:center"><button class="btn-circle-add" title="Seleccionar concepto" onclick="seleccionarConcepto('${c.codigo}', '${c.servicio.replace(/'/g, "\\'")}', ${c.monto})">${SVG_ICONS.plus}</button></td>
          <td><span class="mono strong" style="color:var(--brand-dark)">${c.codigo}</span></td>
          <td><b>${c.servicio}</b></td>
          <td><b>${APP.money(c.monto)}</b></td>
          <td><span class="muted" style="font-size:12px">${c.obs || '-'}</span></td>
        </tr>
      `).join('');

      const popup = document.createElement('div');
      popup.id = 'concept-popup-layer';
      popup.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
      popup.innerHTML = `
        <div style="background:#FFF;border-radius:12px;max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border:1px solid var(--border)">
          <div style="padding:14px 20px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center">
            <h4 style="margin:0;font-size:16px;color:var(--brand-dark)">Catálogo de Conceptos de Caja / Facturación</h4>
            <button class="modal-close" onclick="cerrarConceptPopup()">×</button>
          </div>
          <div style="padding:14px 20px;overflow-y:auto;flex:1">
            <table class="modal-table" style="margin:0">
              <thead>
                <tr>
                  <th style="width:45px;text-align:center">Sel.</th>
                  <th>Código</th>
                  <th>Servicio</th>
                  <th>Monto</th>
                  <th>Observación</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div style="padding:12px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end">
            <button class="btn btn-sm" onclick="cerrarConceptPopup()">Cerrar</button>
          </div>
        </div>
      `;
      document.body.appendChild(popup);
    }

    function cerrarConceptPopup() {
      const p = document.getElementById('concept-popup-layer');
      if (p) p.remove();
    }

    function seleccionarConcepto(codigo, servicio, monto) {
      if (document.getElementById('t-concepto-cod')) document.getElementById('t-concepto-cod').value = codigo;
      if (document.getElementById('t-concepto-serv')) document.getElementById('t-concepto-serv').value = servicio;
      if (document.getElementById('t-costo')) document.getElementById('t-costo').value = monto;
      if (document.getElementById('t-titulo') && !document.getElementById('t-titulo').value) {
        document.getElementById('t-titulo').value = servicio;
      }
      cerrarConceptPopup();
      APP.toast({ icon: '🏷️', title: 'Concepto vinculado', body: `Código ${codigo}: ${servicio} (S/ ${monto})` });
    }

    function guardarTramite(id) {
      const nombre = document.getElementById('t-titulo').value.trim();
      if (!nombre) { APP.toast({ icon: '⚠️', title: 'Falta título', body: 'Ingresa el título o nombre del trámite.' }); return; }

      const niveles = [];
      if (document.getElementById('t-aud-pre') && document.getElementById('t-aud-pre').checked) niveles.push('pregrado');
      if (document.getElementById('t-aud-post') && document.getElementById('t-aud-post').checked) niveles.push('postgrado');
      const ciclos = Array.from(document.querySelectorAll('input[data-ciclo]:checked')).map(i => +i.dataset.ciclo);

      const existing = id ? DB.getTramite(id) : null;

      const t = {
        id: id || null,
        codigo: document.getElementById('t-codigo') ? document.getElementById('t-codigo').value : (existing ? existing.codigo : 'T-00' + (DB.tramites().length + 1)),
        nombre,
        descripcion: document.getElementById('t-desc') ? document.getElementById('t-desc').value.trim() : (existing ? existing.descripcion : ''),
        conceptoCodigo: document.getElementById('t-concepto-cod') ? document.getElementById('t-concepto-cod').value.trim() : '',
        conceptoServicio: document.getElementById('t-concepto-serv') ? document.getElementById('t-concepto-serv').value.trim() : '',
        costo: parseFloat(document.getElementById('t-costo').value) || 0,
        tiempoVigenciaHrs: parseInt(document.getElementById('t-vigencia').value) || 48,
        plazoRecojoDias: parseInt(document.getElementById('t-recojo').value) || 3,
        area: document.getElementById('t-area-resp') ? document.getElementById('t-area-resp').value : (existing ? existing.area : 'Registros Académicos'),
        observacion: document.getElementById('t-obs') ? document.getElementById('t-obs').value.trim() : '',
        tipoActivacion: document.getElementById('t-tipo-act').value,
        envioCorreo: document.getElementById('t-envio-correo').value === 'si',
        pagoMomento: document.getElementById('t-pago-momento') ? document.getElementById('t-pago-momento').value : 'despues',
        activo: document.getElementById('t-habilitar').value === 'si',
        fechaRegistro: existing ? (existing.fechaRegistro || '2026-07-19') : new Date().toISOString().slice(0, 10),
        tipo: document.getElementById('t-tipo') ? document.getElementById('t-tipo').value : (existing ? existing.tipo : 'Constancia'),
        modelo: document.getElementById('t-modelo') ? document.getElementById('t-modelo').value : (existing ? existing.modelo : 'constancia'),
        diasEntrega: parseInt(document.getElementById('t-recojo').value) || 3,
        requiereAprobacion: existing ? existing.requiereAprobacion : true,
        requiereAdjunto: existing ? existing.requiereAdjunto : false,
        adjuntoIndicacion: existing ? existing.adjuntoIndicacion : '',
        intenciones: existing ? existing.intenciones : ['todos'],
        audiencia: {
          niveles: niveles.length ? niveles : (existing && existing.audiencia ? existing.audiencia.niveles : ['pregrado']),
          ciclos,
          minCreditos: document.getElementById('t-aud-cred') ? (parseInt(document.getElementById('t-aud-cred').value) || 0) : 0,
          promedioMin: document.getElementById('t-aud-prom') ? (parseFloat(document.getElementById('t-aud-prom').value) || 0) : 0,
          tercioSuperior: document.getElementById('t-aud-tercio') ? document.getElementById('t-aud-tercio').checked : false,
          quintoSuperior: document.getElementById('t-aud-quinto') ? document.getElementById('t-aud-quinto').checked : false
        },
        plantilla: {
          generaDocumento: existing ? DOC.getPlantilla(existing).generaDocumento : true,
          emisor: document.getElementById('p-emisor') ? document.getElementById('p-emisor').value.trim() : 'Universidad Privada Norbert Wiener',
          titulo: document.getElementById('p-titulo') ? document.getElementById('p-titulo').value.trim() : nombre,
          cuerpo: document.getElementById('p-cuerpo') ? document.getElementById('p-cuerpo').value.trim() : '',
          firmante: document.getElementById('p-firmante') ? document.getElementById('p-firmante').value.trim() : 'Dirección de Registros Académicos',
          cargo: document.getElementById('p-cargo') ? document.getElementById('p-cargo').value.trim() : 'Secretario General'
        },
        requisitos: existing && existing.requisitos ? existing.requisitos : [],
        proceso: existing && existing.proceso ? existing.proceso : [
          { id: 'P-1', orden: 1, area: 'Registros Académicos', descripcion: 'revisa las notas', observacion: '', duracionDias: 2, activo: true }
        ],
        cronogramas: existing && existing.cronogramas ? existing.cronogramas : [],
        correoConfig: existing && existing.correoConfig ? existing.correoConfig : {
          remitente: 'tramites@uwiener.edu.pe',
          asunto: `Actualización sobre tu trámite: ${nombre}`,
          mensaje: `Estimado(a) estudiante, tu trámite ${nombre} se encuentra en atención.`
        }
      };

      DB.upsertTramite(t);
      APP.closeModal();
      APP.toast({ icon: '✅', title: 'Trámite Guardado', body: `«${nombre}» se configuró exitosamente.` });
      render();
    }

    function eliminarTramite(id) {
      const t = DB.getTramite(id);
      if (!t) return;
      mostrarConfirmacionModal({
        titulo: 'Eliminar Trámite',
        icono: SVG_ICONS.warn,
        mensaje: `¿Estás seguro de que deseas eliminar permanentemente el trámite <b>«${t.nombre}»</b>?<br><br><span style="font-size:12px;color:var(--text-muted)">Esta acción retirará el trámite del catálogo oficial. No afectará las solicitudes históricas registradas.</span>`,
        textoBoton: 'Sí, Eliminar Trámite',
        onConfirm: () => {
          DB.deleteTramite(id);
          cerrarConfirmacionModal();
          APP.toast({ icon: '🗑️', title: 'Trámite eliminado', body: `«${t.nombre}» fue retirado del catálogo.` });
          render();
        }
      });
    }

    // =========================================================================
    // MODAL: EDITAR REQUISITO Y PROCESO DEL TRÁMITE (Capturas 3 y 4)
    // =========================================================================
    let SHOW_AREAS_POPUP = false;
    let SHOW_REQS_POPUP = false;

    function editarProcesoTramite(id) {
      const t = JSON.parse(JSON.stringify(DB.getTramite(id)));
      if (!Array.isArray(t.requisitos)) t.requisitos = [];
      if (!Array.isArray(t.proceso)) t.proceso = [];

      window._PROCESO_DRAFT = t;
      SHOW_AREAS_POPUP = false;
      SHOW_REQS_POPUP = false;

      renderProcesoModalBody();
    }

    function renderProcesoModalBody() {
      const t = window._PROCESO_DRAFT;
      const areas = DB.areas();
      const allReqs = DB.requisitos();

      // Popup / Subpanel de Requisitos Disponibles
      let reqPopupHTML = '';
      if (SHOW_REQS_POPUP) {
        const dispoReqs = allReqs.map((rq, rIdx) => `
          <tr>
            <td style="text-align:center">
              <button type="button" class="btn-circle-add" title="Agregar requisito a este trámite" onclick="procesoAgregarRequisitoItem('${rq.id}')">${SVG_ICONS.plus}</button>
            </td>
            <td style="text-align:center"><span class="mono muted">${rIdx + 1}</span></td>
            <td><b>${rq.titulo}</b></td>
            <td><span class="tag gray" style="font-size:11px">${rq.requiereAdjunto ? (rq.formato || 'PDF') : 'Sin archivo'}</span></td>
          </tr>
        `).join('');

        reqPopupHTML = `
          <div style="background:#F8FAFC;border:1px solid #CBD5E1;border-radius:10px;padding:14px;margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <b style="font-size:13.5px;color:var(--brand-dark)">Catálogo Maestro de Requisitos:</b>
              <button type="button" class="btn-circle-del" title="Cerrar selección" onclick="SHOW_REQS_POPUP=false;renderProcesoModalBody()">${SVG_ICONS.cross}</button>
            </div>
            <div style="max-height:180px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:8px;background:#FFF">
              <table class="modal-table" style="margin:0">
                <thead>
                  <tr>
                    <th style="width:45px;text-align:center">Agregar</th>
                    <th style="width:40px;text-align:center">Nro.</th>
                    <th>Requisito</th>
                    <th style="width:110px">Formato</th>
                  </tr>
                </thead>
                <tbody>
                  ${dispoReqs.length ? dispoReqs : `<tr><td colspan="4" style="text-align:center;padding:14px;color:var(--text-muted)">No hay requisitos disponibles en el catálogo.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // Popup / Subpanel de Selección de Áreas (Captura 4)
      let areasPopupHTML = '';
      if (SHOW_AREAS_POPUP) {
        const areaRows = areas.map((ar, aIdx) => `
          <tr>
            <td style="text-align:center">
              <button type="button" class="btn-circle-add" title="Agregar al proceso" onclick="procesoAgregarAreaItem('${ar.nombre.replace(/'/g, "\\'")}')">${SVG_ICONS.plus}</button>
            </td>
            <td style="text-align:center"><span class="mono muted">${aIdx + 1}</span></td>
            <td><b>${ar.nombre}</b></td>
          </tr>
        `).join('');

        areasPopupHTML = `
          <div style="background:#F8FAFC;border:1px solid #CBD5E1;border-radius:10px;padding:14px;margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <b style="font-size:13.5px;color:var(--brand-dark)">Áreas:</b>
              <button type="button" class="btn-circle-del" title="Cerrar áreas" onclick="SHOW_AREAS_POPUP=false;renderProcesoModalBody()">${SVG_ICONS.cross}</button>
            </div>
            <div style="max-height:220px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:8px;background:#FFF">
              <table class="modal-table" style="margin:0">
                <thead>
                  <tr>
                    <th style="width:45px;text-align:center"></th>
                    <th style="width:45px;text-align:center">Nro.</th>
                    <th>Área</th>
                  </tr>
                </thead>
                <tbody>
                  ${areaRows.length ? areaRows : `<tr><td colspan="3" style="text-align:center;padding:14px;color:var(--text-muted)">No hay áreas institucionales registradas.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // Filas de Requisitos vinculados (Captura 3)
      const reqRows = (t.requisitos || []).map((r, idx) => `
        <tr>
          <td style="text-align:center"><span class="mono muted">${idx + 1}</span></td>
          <td><b>${r.titulo}</b></td>
          <td style="text-align:center">
            <select class="select" style="padding:4px 8px;font-size:12px;width:75px" onchange="window._PROCESO_DRAFT.requisitos[${idx}].adjuntarArchivo = (this.value === 'si')">
              <option value="si" ${r.adjuntarArchivo ? 'selected' : ''}>Sí</option>
              <option value="no" ${!r.adjuntarArchivo ? 'selected' : ''}>No</option>
            </select>
          </td>
          <td style="text-align:center">
            <select class="select" style="padding:4px 8px;font-size:12px;width:75px" onchange="window._PROCESO_DRAFT.requisitos[${idx}].activo = (this.value === 'si')">
              <option value="si" ${r.activo ? 'selected' : ''}>Sí</option>
              <option value="no" ${!r.activo ? 'selected' : ''}>No</option>
            </select>
          </td>
          <td style="text-align:center">
            <input class="input" type="number" min="1" value="${r.orden || (idx + 1)}" style="width:60px;padding:4px 6px;text-align:center" onchange="window._PROCESO_DRAFT.requisitos[${idx}].orden = parseInt(this.value)||1">
          </td>
          <td style="text-align:center">
            <button type="button" class="btn-circle-del" title="Quitar requisito" onclick="confirmarQuitarRequisitoTramite(${idx})">${SVG_ICONS.trash}</button>
          </td>
        </tr>
      `).join('');

      // Filas de Procesos / Áreas secuenciales
      const procRows = (t.proceso || []).map((p, idx) => `
        <tr>
          <td style="text-align:center"><span class="mono muted">${idx + 1}</span></td>
          <td>
            <div class="strong" style="font-size:13px;color:var(--text);margin-bottom:2px">${p.area}</div>
          </td>
          <td>
            <textarea class="input" style="font-size:12px;min-height:50px;padding:6px;width:100%" maxlength="500" placeholder="Descripción de la tarea a realizar en esta etapa..." onchange="window._PROCESO_DRAFT.proceso[${idx}].descripcion = this.value">${p.descripcion || ''}</textarea>
            <div class="char-limit-text">máx. 500 caracteres.</div>
          </td>
          <td>
            <textarea class="input" style="font-size:12px;min-height:50px;padding:6px;width:100%" maxlength="500" placeholder="Observación institucional..." onchange="window._PROCESO_DRAFT.proceso[${idx}].observacion = this.value">${p.observacion || ''}</textarea>
            <div class="char-limit-text">máx. 500 caracteres.</div>
          </td>
          <td style="text-align:center">
            <div style="display:inline-flex;align-items:center;gap:4px">
              <input class="input" type="number" min="1" value="${p.duracionDias || 2}" style="width:55px;padding:4px 6px;text-align:center" onchange="window._PROCESO_DRAFT.proceso[${idx}].duracionDias = parseInt(this.value)||1">
              <span style="font-size:11.5px;color:var(--text-muted)">días.</span>
            </div>
          </td>
          <td style="text-align:center">
            <select class="select" style="padding:4px 8px;font-size:12px;width:75px" onchange="window._PROCESO_DRAFT.proceso[${idx}].activo = (this.value === 'si')">
              <option value="si" ${p.activo ? 'selected' : ''}>Si</option>
              <option value="no" ${!p.activo ? 'selected' : ''}>No</option>
            </select>
          </td>
          <td style="text-align:center">
            <button type="button" class="btn-circle-del" title="Quitar paso del proceso" onclick="confirmarQuitarPasoProceso(${idx})">${SVG_ICONS.trash}</button>
          </td>
        </tr>
      `).join('');

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${SVG_ICONS.proceso}
            </div>
            <div>
              <h3>Editar Requisito y Proceso: ${t.nombre}</h3>
              <div style="font-size:12px;color:var(--text-muted)">Configuración de flujo operativo secuencial institucional</div>
            </div>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>
        <div class="modal-body" style="max-height:80vh;overflow-y:auto">

          <!-- BLOQUE 1: REQUISITOS -->
          <div style="background:#FFF;border:1px solid var(--border-soft);border-radius:10px;padding:16px;margin-bottom:18px">
            <div style="margin-bottom:10px">
              <b style="font-size:13.5px;color:var(--text);display:block;margin-bottom:8px">Requisitos:</b>
              <button type="button" class="btn btn-dark" onclick="SHOW_REQS_POPUP = !SHOW_REQS_POPUP; renderProcesoModalBody()">
                ${SVG_ICONS.plus} <span>Agregar Requisitos</span>
              </button>
            </div>

            ${reqPopupHTML}

            <table class="modal-table">
              <thead>
                <tr>
                  <th style="width:45px;text-align:center">N°</th>
                  <th>Descripción</th>
                  <th style="width:120px;text-align:center">Adjuntar Archivo</th>
                  <th style="width:95px;text-align:center">Activo</th>
                  <th style="width:90px;text-align:center">Orden</th>
                  <th style="width:60px;text-align:center">Quitar</th>
                </tr>
              </thead>
              <tbody>
                ${reqRows.length ? reqRows : `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:18px">(*) No se encontraron Requisitos registrados para este trámite.</td></tr>`}
              </tbody>
            </table>
          </div>

          <!-- BLOQUE 2: ÁREA RESPONSABLE -->
          <div style="background:#FFF;border:1px solid var(--border-soft);border-radius:10px;padding:16px;margin-bottom:18px">
            <div class="field" style="max-width:440px;margin:0">
              <label style="font-size:13.5px;font-weight:700;color:var(--text);display:block;margin-bottom:6px">Área Responsable Principal:</label>
              <select class="select" id="proc-area-principal" style="width:100%" onchange="window._PROCESO_DRAFT.area = this.value">
                <option value="">-- Seleccione Área Responsable --</option>
                ${areas.map(ar => `<option value="${ar.nombre}" ${t.area === ar.nombre ? 'selected' : ''}>${ar.nombre}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- BLOQUE 3: PROCESO -->
          <div style="background:#FFF;border:1px solid var(--border-soft);border-radius:10px;padding:16px">
            <div style="margin-bottom:12px">
              <b style="font-size:13.5px;color:var(--text);display:block;margin-bottom:8px">Proceso:</b>
              <button type="button" class="btn btn-dark" onclick="SHOW_AREAS_POPUP = !SHOW_AREAS_POPUP; renderProcesoModalBody()">
                ${SVG_ICONS.plus} <span>Agregar Áreas</span>
              </button>
            </div>

            ${areasPopupHTML}

            <table class="modal-table">
              <thead>
                <tr>
                  <th style="width:45px;text-align:center">N°</th>
                  <th style="width:190px">Área</th>
                  <th>Descripción de la Tarea</th>
                  <th>Observación</th>
                  <th style="width:100px;text-align:center">Duración</th>
                  <th style="width:85px;text-align:center">Activo</th>
                  <th style="width:65px;text-align:center">Quitar</th>
                </tr>
              </thead>
              <tbody>
                ${procRows.length ? procRows : `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:22px">(*) No se encontraron Procesos registrados para este trámite.</td></tr>`}
              </tbody>
            </table>
          </div>

        </div>
        <div class="modal-foot">
          <button type="button" class="btn" onclick="APP.closeModal()">Cerrar</button>
          <button type="button" class="btn btn-primary" onclick="grabarProcesoYRequisitos()" style="display:inline-flex;align-items:center;gap:6px">
            ${SVG_ICONS.check} Grabar Proceso y Requisitos
          </button>
        </div>
      `, { wide: true });
    }

    function procesoAgregarRequisitoItem(reqId) {
      const rm = DB.getRequisito(reqId);
      if (!rm) return;
      const yaExiste = window._PROCESO_DRAFT.requisitos.some(r => r.id === rm.id || r.titulo === rm.titulo);
      if (yaExiste) {
        APP.toast({ icon: '⚠️', title: 'Ya registrado', body: `«${rm.titulo}» ya está en los requisitos.` });
        return;
      }
      window._PROCESO_DRAFT.requisitos.push({
        id: rm.id,
        titulo: rm.titulo,
        adjuntarArchivo: rm.requiereAdjunto,
        activo: true,
        orden: window._PROCESO_DRAFT.requisitos.length + 1
      });
      SHOW_REQS_POPUP = false;
      renderProcesoModalBody();
      APP.toast({ icon: '📎', title: 'Requisito agregado', body: rm.titulo });
    }

    function procesoAgregarAreaItem(areaNombre) {
      window._PROCESO_DRAFT.proceso.push({
        id: 'P-' + Date.now(),
        orden: window._PROCESO_DRAFT.proceso.length + 1,
        area: areaNombre,
        descripcion: 'revisa las notas',
        observacion: '',
        duracionDias: 2,
        activo: true
      });
      SHOW_AREAS_POPUP = false;
      renderProcesoModalBody();
      APP.toast({ icon: '🏢', title: 'Área agregada al proceso', body: `«${areaNombre}» agregada como paso N° ${window._PROCESO_DRAFT.proceso.length}.` });
    }

    function confirmarQuitarRequisitoTramite(idx) {
      const r = window._PROCESO_DRAFT.requisitos[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Requisito',
        icono: SVG_ICONS.warn,
        mensaje: `¿Deseas desvincular el requisito <b>«${r.titulo}»</b> de este trámite?`,
        textoBoton: 'Quitar Requisito',
        onConfirm: () => {
          window._PROCESO_DRAFT.requisitos.splice(idx, 1);
          cerrarConfirmacionModal();
          renderProcesoModalBody();
        }
      });
    }

    function confirmarQuitarPasoProceso(idx) {
      const p = window._PROCESO_DRAFT.proceso[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Paso del Proceso',
        icono: SVG_ICONS.warn,
        mensaje: `¿Deseas quitar la etapa de <b>«${p.area}»</b> (Paso N° ${idx + 1}) del flujo operativo?`,
        textoBoton: 'Quitar Paso',
        onConfirm: () => {
          window._PROCESO_DRAFT.proceso.splice(idx, 1);
          cerrarConfirmacionModal();
          renderProcesoModalBody();
        }
      });
    }

    function grabarProcesoYRequisitos() {
      const t = window._PROCESO_DRAFT;
      t.requiereAdjunto = (t.requisitos || []).some(r => r.adjuntarArchivo && r.activo);
      if (t.requiereAdjunto && !t.adjuntoIndicacion) {
        t.adjuntoIndicacion = 'Adjuntar los documentos requeridos en el catálogo oficial.';
      }
      DB.upsertTramite(t);
      APP.closeModal();
      APP.toast({ icon: '✅', title: 'Flujo actualizado', body: `Requisitos y proceso guardados para «${t.nombre}».` });
      render();
    }

    // =========================================================================
    // MODAL: CRONOGRAMA DE VISIBILIDAD (Captura 5)
    // =========================================================================
    let DRAFT_CRONOGRAMA = null;
    let DRAFT_CRONOGRAMA_ID = null;
    let SHOW_TODOS_CRONOGRAMAS = false;

    function gestionarCronograma(id) {
      DRAFT_CRONOGRAMA_ID = id;
      const t = DB.getTramite(id);
      DRAFT_CRONOGRAMA = JSON.parse(JSON.stringify(t.cronogramas || []));
      SHOW_TODOS_CRONOGRAMAS = false;
      renderCronogramaModal();
    }

    function cronogCambiarGrado(idx, nuevoGrado) {
      syncCronogramaDraftFromDOM();
      DRAFT_CRONOGRAMA[idx].grado = nuevoGrado;
      const mods = MODALIDADES_POR_GRADO[nuevoGrado] || ['Todas'];
      DRAFT_CRONOGRAMA[idx].modalidad = mods[0] || 'Todas';
      renderCronogramaModal();
    }

    function syncCronogramaDraftFromDOM() {
      if (!Array.isArray(DRAFT_CRONOGRAMA)) return;
      DRAFT_CRONOGRAMA.forEach((c, idx) => {
        const grd = document.getElementById(`cr-grd-${idx}`);
        const mod = document.getElementById(`cr-mod-${idx}`);
        const fac = document.getElementById(`cr-fac-${idx}`);
        const car = document.getElementById(`cr-car-${idx}`);
        const per = document.getElementById(`cr-per-${idx}`);
        const ini = document.getElementById(`cr-ini-${idx}`);
        const fin = document.getElementById(`cr-fin-${idx}`);
        const act = document.getElementById(`cr-act-${idx}`);
        if (grd) c.grado = grd.value;
        if (mod) c.modalidad = mod.value;
        if (fac) c.facultad = fac.value;
        if (car) c.carrera = car.value;
        if (per) c.periodo = per.value;
        if (ini) c.fechaInicio = ini.value;
        if (fin) c.fechaFin = fin.value;
        if (act) c.activo = (act.value === 'si');
      });
    }

    function cronogAgregarItem() {
      syncCronogramaDraftFromDOM();
      const defaultGrado = 'Pregrado';
      const defaultMod = MODALIDADES_POR_GRADO[defaultGrado][1] || 'Modalidad Ordinaria';
      DRAFT_CRONOGRAMA.push({
        id: 'CR-' + Date.now(),
        grado: defaultGrado,
        modalidad: defaultMod,
        facultad: 'Todas',
        carrera: 'Todas',
        periodo: '2026-1',
        fechaInicio: new Date().toISOString().slice(0, 10),
        fechaFin: new Date(Date.now() + 30*24*60*60*1000).toISOString().slice(0, 10),
        activo: true
      });
      renderCronogramaModal();
    }

    function confirmarQuitarUltimoItemCronograma() {
      syncCronogramaDraftFromDOM();
      if (!DRAFT_CRONOGRAMA.length) {
        APP.toast({ icon: 'ℹ️', title: 'Sin ítems', body: 'No hay ítems registrados en el cronograma para quitar.' });
        return;
      }
      mostrarConfirmacionModal({
        titulo: 'Quitar Último Ítem',
        icono: SVG_ICONS.warn,
        mensaje: `¿Deseas quitar el último rango del cronograma (Ítem N° ${DRAFT_CRONOGRAMA.length})?`,
        textoBoton: 'Quitar Ítem',
        onConfirm: () => {
          DRAFT_CRONOGRAMA.pop();
          cerrarConfirmacionModal();
          renderCronogramaModal();
          APP.toast({ icon: '🗑️', title: 'Ítem quitado', body: 'Se removió el último rango del cronograma.' });
        }
      });
    }

    function confirmarQuitarItemCronograma(idx) {
      syncCronogramaDraftFromDOM();
      const c = DRAFT_CRONOGRAMA[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Rango de Cronograma',
        icono: SVG_ICONS.warn,
        mensaje: `¿Deseas quitar el rango <b>Ítem N° ${idx + 1}</b> (${c.grado} - ${c.modalidad})?`,
        textoBoton: 'Quitar Rango',
        onConfirm: () => {
          DRAFT_CRONOGRAMA.splice(idx, 1);
          cerrarConfirmacionModal();
          renderCronogramaModal();
          APP.toast({ icon: '🗑️', title: 'Rango quitado', body: 'Rango removido del cronograma.' });
        }
      });
    }

    function grabarItemsCronograma() {
      syncCronogramaDraftFromDOM();
      const t = DB.getTramite(DRAFT_CRONOGRAMA_ID);
      t.cronogramas = DRAFT_CRONOGRAMA;
      DB.upsertTramite(t);
      APP.closeModal();
      APP.toast({ icon: '📅', title: 'Cronograma guardado', body: `Rangos de cronograma actualizados para «${t.nombre}».` });
      render();
    }

    function renderCronogramaModal() {
      const t = DB.getTramite(DRAFT_CRONOGRAMA_ID);

      // Bloque "Todos los Cronogramas" (Captura 5)
      let todosBoxHTML = '';
      if (SHOW_TODOS_CRONOGRAMAS) {
        todosBoxHTML = `
          <div style="background:#F0FAFA;border:1px solid #BFE6E9;border-radius:8px;padding:12px 16px;margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <b style="color:var(--brand-dark);font-size:13px">Todos los Cronogramas</b>
              <button type="button" class="btn-circle-del" title="Cerrar vista" onclick="SHOW_TODOS_CRONOGRAMAS=false;renderCronogramaModal()">${SVG_ICONS.cross}</button>
            </div>
            <div style="font-size:12.5px;color:var(--text-soft)">
              ${DRAFT_CRONOGRAMA.length ? `Actualmente hay <b>${DRAFT_CRONOGRAMA.length} rango(s)</b> configurado(s) para este trámite.` : 'No se encontraron Requisitos registrados.'}
            </div>
          </div>
        `;
      }

      // Generación de ítems de cronograma con el sistema de diseño Wiener
      const itemsHTML = DRAFT_CRONOGRAMA.map((c, idx) => {
        const modsList = MODALIDADES_POR_GRADO[c.grado] || ['Todas'];
        const gradoOpts = GRADOS_ESTUDIO.map(g => `<option value="${g}" ${g === c.grado ? 'selected' : ''}>${g}</option>`).join('');
        const modOpts = modsList.map(m => `<option value="${m}" ${m === c.modalidad ? 'selected' : ''}>${m}</option>`).join('');
        const facOpts = FACULTADES_CATALOGO.map(f => `<option value="${f}" ${f === c.facultad ? 'selected' : ''}>${f}</option>`).join('');
        const carOpts = CARRERAS_CATALOGO.map(cr => `<option value="${cr}" ${cr === c.carrera ? 'selected' : ''}>${cr}</option>`).join('');
        const perOpts = PERIODOS_CATALOGO.map(p => `<option value="${p}" ${p === c.periodo ? 'selected' : ''}>${p}</option>`).join('');

        return `
          <div class="cronog-card-wiener">
            <div style="background:var(--surface-2);padding:10px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center">
              <div style="display:flex;align-items:center;gap:8px">
                <span class="mono strong" style="font-size:13px;color:var(--brand-dark)">Rango N° ${idx + 1}</span>
                <span class="tag teal" style="font-size:11px;font-weight:700">${c.grado}</span>
                <span class="tag" style="font-size:11px">${c.modalidad}</span>
              </div>
              <button type="button" class="btn btn-sm" style="background:#FEE2E2;border:1px solid #FCA5A5;color:#DC2626;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px" title="Quitar este rango" onclick="confirmarQuitarItemCronograma(${idx})">
                ${SVG_ICONS.trash} <span>Quitar</span>
              </button>
            </div>
            <div style="padding:16px">
              <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));gap:12px;margin-bottom:14px">
                <div class="field" style="margin:0">
                  <label style="font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:4px;display:block">Grado Estudio *</label>
                  <select class="select" id="cr-grd-${idx}" style="font-size:13px;width:100%" onchange="cronogCambiarGrado(${idx}, this.value)">
                    ${gradoOpts}
                  </select>
                </div>
                <div class="field" style="margin:0">
                  <label style="font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:4px;display:block">Modalidad de Estudio *</label>
                  <select class="select" id="cr-mod-${idx}" style="font-size:13px;width:100%">
                    ${modOpts}
                  </select>
                </div>
                <div class="field" style="margin:0">
                  <label style="font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:4px;display:block">Facultad</label>
                  <select class="select" id="cr-fac-${idx}" style="font-size:13px;width:100%">
                    ${facOpts}
                  </select>

    function abrirSubformCorreo(idx) {
      ACTIVE_CORREO_EDIT_IDX = idx;
      renderCorreoModal();
    }

    function cerrarSubformCorreo() {
      ACTIVE_CORREO_EDIT_IDX = null;
      renderCorreoModal();
    }

    function guardarSubformCorreo() {
      const estado = document.getElementById('mail-sub-estado').value;
      const remitente = document.getElementById('mail-sub-remitente').value.trim();
      const pass = document.getElementById('mail-sub-pass').value;
      const asunto = document.getElementById('mail-sub-asunto').value.trim();
      const cc = document.getElementById('mail-sub-cc').value.trim();
      const contenido = document.getElementById('mail-sub-contenido').value.trim();
      const activo = document.getElementById('mail-sub-activo').value === 'si';

      if (!remitente || !remitente.includes('@')) {
        APP.toast({ icon: '⚠️', title: 'Correo inválido', body: 'Ingresa un correo remitente institucional válido.' });
        return;
      }
      if (!asunto) {
        APP.toast({ icon: '⚠️', title: 'Falta asunto', body: 'Ingresa el asunto del correo institucional.' });
        return;
      }
      if (!contenido) {
        APP.toast({ icon: '⚠️', title: 'Falta contenido', body: 'Ingresa el texto o cuerpo del mensaje.' });
        return;
      }

      if (ACTIVE_CORREO_EDIT_IDX === -1) {
        DRAFT_CORREOS.push({
          id: 'MAIL-' + Date.now(),
          tipoEstado: estado,
          remitente,
          password: pass || '••••••••',
          asunto,
          cc,
          contenido,
          activo
        });
        APP.toast({ icon: '✉️', title: 'Plantilla agregada', body: `Notificación para «${estado}» registrada.` });
      } else {
        const item = DRAFT_CORREOS[ACTIVE_CORREO_EDIT_IDX];
        item.tipoEstado = estado;
        item.remitente = remitente;
        if (pass) item.password = pass;
        item.asunto = asunto;
        item.cc = cc;
        item.contenido = contenido;
        item.activo = activo;
        APP.toast({ icon: '✉️', title: 'Plantilla actualizada', body: `Notificación para «${estado}» actualizada.` });
      }

      ACTIVE_CORREO_EDIT_IDX = null;
      renderCorreoModal();
    }

    function confirmarQuitarCorreo(idx) {
      const c = DRAFT_CORREOS[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Plantilla de Correo',
        icono: SVG_ICONS.warn,
        mensaje: `¿Deseas quitar la plantilla de correo para el estado <b>«${c.tipoEstado}»</b>?`,
        textoBoton: 'Quitar Plantilla',
        onConfirm: () => {
          DRAFT_CORREOS.splice(idx, 1);
          cerrarConfirmacionModal();
          renderCorreoModal();
          APP.toast({ icon: '🗑️', title: 'Plantilla quitada', body: `Se removió la notificación para ${c.tipoEstado}.` });
        }
      });
    }

    function guardarTodosLosCorreos() {
      const t = DB.getTramite(DRAFT_CORREOS_TR_ID);
      if (!t) return;
      t.correos = DRAFT_CORREOS;
      if (DRAFT_CORREOS.length) {
        t.correoConfig = {
          remitente: DRAFT_CORREOS[0].remitente,
          asunto: DRAFT_CORREOS[0].asunto,
          mensaje: DRAFT_CORREOS[0].contenido
        };
      }
      DB.upsertTramite(t);
      APP.closeModal();
      APP.toast({ icon: '✉️', title: 'Correos guardados', body: `Plantillas de notificación actualizadas para «${t.nombre}».` });
      render();
    }

            <div class="field full">

              <textarea class="input" id="req-titulo" rows="2" maxlength="500" placeholder="Ej. Certificado de voluntariado o Constancia de no adeudo" oninput="updateCharCounter('req-tit-count', this.value.length, 500)">${r.titulo || ''}</textarea>
              <div class="char-limit-text" id="req-tit-count">${titLen} / 500 caracteres (máx. 500)</div>
            </div>
            <div class="field full">
              <label>Observación e indicaciones</label>
              <textarea class="input" id="req-obs" rows="3" maxlength="1000" placeholder="Ej. Debe ser nítido por ambas caras en documento original..." oninput="updateCharCounter('req-obs-count', this.value.length, 1000)">${r.observacion || ''}</textarea>
              <div class="char-limit-text" id="req-obs-count">${obsLen} / 1000 caracteres (máx. 1000)</div>
            </div>
          </div>

          <!-- CHECKBOX FUERA DE LA CAJA CON SU TEXTO -->
          <div style="margin-top:16px">
            <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;user-select:none">
              <input type="checkbox" id="req-chk-adj" style="margin-top:2px;width:16px;height:16px;accent-color:var(--brand);cursor:pointer" ${r.requiereAdjunto ? 'checked' : ''} onchange="toggleReqAdjuntoBox(this.checked)">
              <span>Si desea que se adjunte un archivo para este requisito; darle check, ingresar el nombre y seleccionar el formato del archivo.</span>
            </label>

            <!-- RECUADRO INTERNO (solo Nombre y Formato) -->
            <div id="adj-box-container" style="background:${r.requiereAdjunto ? '#F8FAFC' : '#F1F5F9'};border:1px solid ${r.requiereAdjunto ? '#CBD5E1' : '#E2E8F0'};border-radius:10px;padding:14px 16px;transition:all 0.2s ease;${!r.requiereAdjunto ? 'opacity:0.55;pointer-events:none' : ''}">
              <div class="form-grid">
                <div class="field">
                  <label>Nombre del Archivo Adjunto *</label>
                  <input class="input" id="req-adj-nom" maxlength="50" value="${r.adjuntoNombre || ''}" placeholder="Ej. DNI_Solicitante o Foto" ${!r.requiereAdjunto ? 'disabled' : ''} oninput="updateCharCounter('req-adj-nom-count', this.value.length, 50)">
                  <div class="char-limit-text" id="req-adj-nom-count">${adjLen} / 50 caracteres (máx. 50)</div>
                </div>
                <div class="field">
                  <label>Formato *</label>
                  <select class="select" id="req-adj-fmt" ${!r.requiereAdjunto ? 'disabled' : ''}>
                    <option value="" ${!r.formato ? 'selected' : ''}>-- Seleccione --</option>
                    <option value="PDF" ${r.formato === 'PDF' ? 'selected' : ''}>PDF</option>
                    <option value="DOC" ${r.formato === 'DOC' ? 'selected' : ''}>DOC</option>
                    <option value="PNG" ${r.formato === 'PNG' ? 'selected' : ''}>PNG</option>
                    <option value="JPG" ${r.formato === 'JPG' ? 'selected' : ''}>JPG</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- HABILITAR CON SWITCH -->
          <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;background:#FFFFFF;border:1px solid var(--border-soft);border-radius:10px;padding:12px 16px">
            <div>
              <div style="font-size:13.5px;font-weight:700;color:var(--text)">Habilitar Requisito</div>
              <div style="font-size:12px;color:var(--text-muted)">Determina si el requisito estará disponible para su uso en los trámites.</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <label class="switch" title="Habilitar / Inhabilitar">
                <input type="checkbox" id="req-habilitar" ${r.activo ? 'checked' : ''} onchange="document.getElementById('req-hab-txt').textContent = this.checked ? 'Activo' : 'Inactivo'">
                <span class="slider"></span>
              </label>
              <span id="req-hab-txt" style="font-size:13px;font-weight:700;color:${r.activo ? 'var(--brand-dark)' : 'var(--text-muted)'};min-width:55px">${r.activo ? 'Activo' : 'Inactivo'}</span>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="APP.closeModal()">Cerrar</button>
          <button class="btn btn-primary" onclick="guardarRequisito('${id || ''}')" style="display:inline-flex;align-items:center;gap:6px">
            ${SVG_ICONS.check} ${id ? 'Guardar Cambios' : 'Grabar Requisito'}
          </button>
        </div>
      `, { wide: false });
    }

    function toggleReqAdjuntoBox(checked) {
      const box = document.getElementById('adj-box-container');
      const nomInput = document.getElementById('req-adj-nom');
      const fmtSelect = document.getElementById('req-adj-fmt');
      if (box && nomInput && fmtSelect) {
        if (checked) {
          box.style.opacity = '1';
          box.style.background = '#F8FAFC';
          box.style.borderColor = '#CBD5E1';
          box.style.pointerEvents = 'auto';
          nomInput.disabled = false;
          fmtSelect.disabled = false;
          nomInput.focus();
        } else {
          box.style.opacity = '0.55';
          box.style.background = '#F1F5F9';
          box.style.borderColor = '#E2E8F0';
          box.style.pointerEvents = 'none';
          nomInput.disabled = true;
          fmtSelect.disabled = true;
        }
      }
    }

    function guardarRequisito(id) {
      const titulo = document.getElementById('req-titulo').value.trim();
      if (!titulo) {
        APP.toast({ icon: '⚠️', title: 'Falta título', body: 'Ingresa la descripción del requisito.' });
        document.getElementById('req-titulo').focus();
        return;
      }

      const reqAdj = document.getElementById('req-chk-adj').checked;
      let adjNom = '';
      let fmt = '';
      if (reqAdj) {
        adjNom = document.getElementById('req-adj-nom').value.trim();
        fmt = document.getElementById('req-adj-fmt').value;
        if (!adjNom) {
          APP.toast({ icon: '⚠️', title: 'Falta nombre de archivo', body: 'Ingresa el nombre del archivo adjunto requerido.' });
          document.getElementById('req-adj-nom').focus();
          return;
        }
        if (!fmt) {
          APP.toast({ icon: '⚠️', title: 'Falta formato', body: 'Selecciona el formato admitido (PDF, DOC, PNG, JPG).' });
          document.getElementById('req-adj-fmt').focus();
          return;
        }
      }

      const r = {
        id: id || ('REQ-' + String(DB.requisitos().length + 1).padStart(3, '0')),
        codigo: document.getElementById('req-cod').value,
        titulo,
        observacion: document.getElementById('req-obs').value.trim(),
        requiereAdjunto: reqAdj,
        adjuntoNombre: adjNom,
        formato: fmt,
        activo: document.getElementById('req-habilitar').checked,
        fechaRegistro: (id && DB.getRequisito(id)) ? DB.getRequisito(id).fechaRegistro : new Date().toISOString().slice(0, 10)
      };

      DB.upsertRequisito(r);
      APP.closeModal();
      APP.toast({ icon: '✅', title: id ? 'Requisito actualizado' : 'Requisito guardado', body: `«${titulo}» registrado en el catálogo maestro.` });
      render();
    }

    function eliminarRequisito(id) {
      const r = DB.getRequisito(id);
      if (!r) return;

      const tramitesUsan = DB.tramites().filter(t => {
        if (!t.requisitos) return false;
        return t.requisitos.some(item => (typeof item === 'string' && (item === r.id || item === r.titulo)) || (typeof item === 'object' && (item.id === r.id || item.titulo === r.titulo)));
      });
      const cantUsos = tramitesUsan.length;

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:var(--warn-fg);display:inline-flex;align-items:center">${SVG_ICONS.warn}</span>
            <h3>Confirmar Eliminación de Requisito</h3>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="font-size:14px;color:var(--text);margin-bottom:12px">
            ¿Estás seguro de que deseas eliminar permanentemente el requisito <b>«${r.titulo}»</b> (Código: <code>${r.codigo || r.id}</code>)?
          </p>

          ${cantUsos > 0 ? `
            <div class="alert warn" style="margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:4px">
                ${SVG_ICONS.warn} Advertencia Institucional:
              </div>
              <div>Este requisito está asociado a <b>${cantUsos} trámite(s)</b> institucional(es):</div>
              <ul style="margin:6px 0 0 16px;padding:0">
                ${tramitesUsan.slice(0, 3).map(t => `<li>${t.nombre}</li>`).join('')}
                ${cantUsos > 3 ? `<li>... y ${cantUsos - 3} trámite(s) más.</li>` : ''}
              </ul>
              <div style="margin-top:6px;font-size:12px">Eliminarlo afectará los requisitos configurados de dichos trámites.</div>
            </div>
          ` : `
            <div class="alert info" style="margin-bottom:14px">
              Este requisito no está siendo utilizado por ningún trámite activo y se puede retirar con total seguridad.
            </div>
          `}

          <div style="font-size:12.5px;color:var(--text-muted)">Esta acción no se puede deshacer.</div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="APP.closeModal()">Cancelar</button>
          <button class="btn btn-danger" style="display:inline-flex;align-items:center;gap:6px" onclick="confirmarEliminarRequisito('${id}')">
            ${SVG_ICONS.trash} Sí, Eliminar definitivamente
          </button>
        </div>
      `, { wide: false });
    }

    function confirmarEliminarRequisito(id) {
      const r = DB.getRequisito(id);
      const titulo = r ? r.titulo : 'Requisito';
      DB.deleteRequisito(id);
      APP.closeModal();
      APP.toast({ icon: '🗑️', title: 'Requisito eliminado', body: `«${titulo}» fue retirado del catálogo.` });
      render();
    }

    // SECCIÓN 2: GESTIÓN DE ÁREAS, SEDES Y RESPONSABLES

    let SHOW_COLAB_SEARCH = false;
    let COLAB_SEARCH_RESULTS = [];

    function guardarNuevaArea(cod) {
      const nom = document.getElementById('nueva-area-nom') ? document.getElementById('nueva-area-nom').value.trim() : '';
      if (!nom) {
        APP.toast({ icon: '⚠️', title: 'Falta el nombre', body: 'Ingresa el nombre o título de la nueva área.' });
        return;
      }
      const obs = document.getElementById('nueva-area-obs') ? document.getElementById('nueva-area-obs').value.trim() : '';
      const hab = document.getElementById('nueva-area-hab') ? document.getElementById('nueva-area-hab').value : 'si';
      const catSedes = DB.sedesCatalogo();

      const nueva = {
        id: cod,
        codigo: cod,
        institucion: 'Universidad Privada Norbert Wiener S.A.',
        nombre: nom,
        observacion: obs,
        activo: (hab === 'si'),
        fechaRegistro: new Date().toISOString().slice(0, 10),
        sedes: [
          { id: 'SED-1', nombre: catSedes[0] || '7803-2 --> LOCAL 1 / Jr. Larrabure y Unanue 110 Santa Beatriz, Lima', activo: true }
        ],
        responsables: []
      };

      DB.upsertArea(nueva);
      APP.closeModal();
      APP.toast({ icon: '🏢', title: 'Área creada', body: `«${nom}» registrada. Ahora puedes configurar sus Sedes y Responsables desde Editar.` });
      render();
    }

    // -------------------------------------------------------------------------
    // 2. FORMULARIO UNIFICADO DE EDICIÓN: DATOS, SEDES Y RESPONSABLES
    // -------------------------------------------------------------------------
    function editarArea(id, subtab) {
      const a = DB.getArea(id);
      if (!a) return;
      DRAFT_AREA = JSON.parse(JSON.stringify(a));
      if (!Array.isArray(DRAFT_AREA.sedes)) DRAFT_AREA.sedes = [];
      if (!Array.isArray(DRAFT_AREA.responsables)) DRAFT_AREA.responsables = [];
      SHOW_COLAB_SEARCH = false;
      COLAB_SEARCH_RESULTS = [];
      renderEditAreaModal(subtab || 'general');
    }

    function syncDraftGeneralFields() {
      const nomEl = document.getElementById('edit-area-nom');
      const obsEl = document.getElementById('edit-area-obs');
      const habEl = document.getElementById('edit-area-hab');
      if (nomEl) DRAFT_AREA.nombre = nomEl.value.trim();
      if (obsEl) DRAFT_AREA.observacion = obsEl.value.trim();
      if (habEl) DRAFT_AREA.activo = (habEl.value === 'si');
    }

    function setSubtabEditArea(subtab) {
      syncDraftGeneralFields();
      renderEditAreaModal(subtab);
    }

              <label>Institución</label>

              <label>Título / Nombre del Área *</label>

              <div class="char-limit-text" id="edit-obs-count">${obsLen} / 500 caracteres (máx. 500)</div>
            </div>

              <label>Habilitar</label>

                <option value="no" ${!DRAFT_AREA.activo ? 'selected' : ''}>No</option>
              </select>
            </div>
          </div>
        `;
      } else if (EDIT_AREA_SUBTAB === 'sedes') {
        // Sub-vista 2: Sedes (Captura 2)
