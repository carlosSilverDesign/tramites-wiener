                  <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:3px">NOMBRES</label>
                  <input class="input" id="colab-nom" placeholder="Ej. CARLOS" onkeyup="if(event.key==='Enter') buscarColaboradores()">
                </div>
                <button type="button" class="btn btn-primary btn-sm" onclick="buscarColaboradores()" style="display:inline-flex;align-items:center;gap:5px">${SVG_ICONS.search} Buscar</button>
              </div>

              <div style="margin-top:14px">
                <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px">${COLAB_SEARCH_RESULTS.length} Registro(s) encontrado(s)</div>
                <div style="max-height:210px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:8px;background:#FFF">
                  <table class="modal-table" style="margin:0">
                    <thead>
                      <tr>
                        <th style="width:40px;text-align:center">Asignar</th>
                        <th style="width:40px;text-align:center">Nro.</th>
                        <th style="width:90px">Personal</th>
                        <th>Apellidos y Nombres</th>
                        <th style="width:65px">Ger.</th>
                        <th>Gerencia</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${resRows.length ? resRows : `<tr><td colspan="6" style="text-align:center;padding:16px;color:var(--text-muted)">Ingresa un criterio de búsqueda y presiona Buscar.</td></tr>`}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;
        }

        const respRows = DRAFT_AREA.responsables.map((r, idx) => {
          return `
            <tr>
              <td style="text-align:center;width:40px"><span class="mono muted">${idx + 1}</span></td>
              <td style="width:85px"><span class="mono" style="font-weight:700;color:var(--brand-dark);font-size:12px">${r.personal || '-'}</span></td>
              <td style="min-width:190px">
                <div class="strong" style="font-size:13px">${r.nombre}</div>
              </td>
              <td style="min-width:210px">
                <div style="font-size:12px;color:var(--text-soft);line-height:1.35">${r.sede || '-'}</div>
              </td>
              <td style="width:135px">
                <select class="select" style="font-size:12px;font-weight:600;padding:5px 8px;width:100%" onchange="draftCambiarResponsable(${idx}, 'cargo', this.value)">
                  <option value="Responsable" ${r.cargo === 'Responsable' ? 'selected' : ''}>Responsable</option>
                  <option value="Coordinador" ${r.cargo === 'Coordinador' ? 'selected' : ''}>Coordinador</option>
                  <option value="Reporteador" ${r.cargo === 'Reporteador' ? 'selected' : ''}>Reporteador</option>
                </select>
              </td>
              <td style="text-align:center;width:75px">
                <label class="switch switch-sm" title="Activar / Desactivar">
                  <input type="checkbox" ${r.activo ? 'checked' : ''} onchange="draftCambiarResponsable(${idx}, 'activo', this.checked)">
                  <span class="slider"></span>
                </label>
              </td>
              <td style="text-align:center;width:60px">
                <button type="button" class="btn-circle-del" title="Quitar responsable del área" onclick="confirmarQuitarResponsable(${idx})">${SVG_ICONS.trash}</button>
              </td>
            </tr>
          `;
        }).join('');

        subContent = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
            <div>
              <div class="section-label" style="margin:0">Equipo de Responsables del Área</div>
              <div style="font-size:12px;color:var(--text-muted)">Define los colaboradores que atienden este departamento y sus permisos.</div>
            </div>
            <button class="btn btn-sm btn-primary" type="button" onclick="toggleColabSearch()" style="display:inline-flex;align-items:center;gap:6px">
              ${SHOW_COLAB_SEARCH ? SVG_ICONS.cross + ' Cerrar Búsqueda' : SVG_ICONS.plus + ' Agregar Responsable'}
            </button>
          </div>

          ${searchPanelHTML}

          <div style="max-height:420px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:8px">
            <table class="modal-table" style="margin:0">
              <thead>
                <tr>
                  <th style="width:40px;text-align:center">N°</th>
                  <th style="width:85px">Personal</th>
                  <th style="min-width:190px">Apellidos y Nombres</th>
                  <th style="min-width:210px">Sede</th>
                  <th style="width:135px">Cargo / Rol</th>
                  <th style="width:75px;text-align:center">Activo</th>
                  <th style="width:60px;text-align:center">Quitar</th>
                </tr>
              </thead>
              <tbody>
                ${respRows.length ? respRows : `<tr><td colspan="7" style="text-align:center;padding:26px;color:var(--text-muted)">No hay responsables asignados. Presiona «+ Agregar Responsable».</td></tr>`}
              </tbody>
            </table>
          </div>
          <div style="margin-top:10px;font-size:12.5px;color:var(--text-muted);font-weight:600">${respCount} Registro(s)</div>
        `;
      }

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${SVG_ICONS.edit}
            </div>
            <div>
              <h3>Editar Área: ${DRAFT_AREA.nombre}</h3>
              <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">
                <b>Código:</b> ${DRAFT_AREA.codigo || DRAFT_AREA.id} &nbsp;·&nbsp; 
                <b>Institución:</b> ${DRAFT_AREA.institucion || 'Universidad Privada Norbert Wiener S.A.'}
              </div>
            </div>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>

        <div class="modal-body" style="max-height:78vh;overflow-y:auto">
          <!-- SUB-TABS INTERNAS -->
          <div class="modal-subnav">
            <button type="button" class="modal-subnav-btn ${EDIT_AREA_SUBTAB === 'general' ? 'active' : ''}" onclick="setSubtabEditArea('general')">
              ${SVG_ICONS.doc} <span>Datos Generales</span>
            </button>
            <button type="button" class="modal-subnav-btn ${EDIT_AREA_SUBTAB === 'sedes' ? 'active' : ''}" onclick="setSubtabEditArea('sedes')">
              ${SVG_ICONS.sede} <span>Sedes (${sedesCount})</span>
            </button>
            <button type="button" class="modal-subnav-btn ${EDIT_AREA_SUBTAB === 'responsables' ? 'active' : ''}" onclick="setSubtabEditArea('responsables')">
              ${SVG_ICONS.user} <span>Responsables (${respCount})</span>
            </button>
          </div>

          <div id="subtab-body">
            ${subContent}
          </div>
        </div>

        <div class="modal-foot" style="display:flex;justify-content:space-between;align-items:center">
          <button class="btn" type="button" onclick="APP.closeModal()">Cancelar</button>
          <button class="btn btn-primary" type="button" onclick="guardarEdicionArea('${DRAFT_AREA.id}')" style="display:inline-flex;align-items:center;gap:6px">${SVG_ICONS.check} Guardar Cambios</button>
        </div>
      `, { wide: true });
    }

    function draftAgregarSede() {
      const cat = DB.sedesCatalogo();
      const yaAsignadas = DRAFT_AREA.sedes.map(s => s.nombre);
      const dispo = cat.find(s => !yaAsignadas.includes(s)) || cat[0] || '7803-2 --> LOCAL 1 / Jr. Larrabure y Unanue 110 Santa Beatriz, Lima';
      DRAFT_AREA.sedes.push({
        id: 'SED-' + Date.now(),
        nombre: dispo,
        activo: true
      });
      renderEditAreaModal('sedes');
    }

    function confirmarQuitarSede(idx) {
      syncDraftGeneralFields();
      if (!DRAFT_AREA || !DRAFT_AREA.sedes || !DRAFT_AREA.sedes[idx]) return;
      if (DRAFT_AREA.sedes.length <= 1) {
        APP.toast({ icon: '⚠️', title: 'Atención', body: 'El área debe contar con al menos una sede registrada.' });
        return;
      }
      const s = DRAFT_AREA.sedes[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Sede del Área',
        icono: SVG_ICONS.warn,
        mensaje: `¿Estás seguro de que deseas desvincular la sede <b>«${s.nombre}»</b> de esta área?`,
        textoBoton: 'Sí, Quitar Sede',
        onConfirm: () => {
          DRAFT_AREA.sedes.splice(idx, 1);
          cerrarConfirmacionModal();
          renderEditAreaModal('sedes');
          APP.toast({ icon: '🗑️', title: 'Sede removida', body: 'Se actualizó la lista de sedes del área.' });
        }
      });
    }

    function draftCambiarSede(idx, campo, val) {
      if (DRAFT_AREA.sedes[idx]) {
        DRAFT_AREA.sedes[idx][campo] = (campo === 'activo' ? (val === 'si' || val === true) : val);
      }
    }

    function toggleColabSearch() {
      SHOW_COLAB_SEARCH = !SHOW_COLAB_SEARCH;
      if (SHOW_COLAB_SEARCH && COLAB_SEARCH_RESULTS.length === 0) {
        COLAB_SEARCH_RESULTS = DB.colaboradores().slice(0, 5);
      }
      renderEditAreaModal('responsables');
    }

    function buscarColaboradores() {
      const pat = (document.getElementById('colab-pat') ? document.getElementById('colab-pat').value.trim().toLowerCase() : '');
      const mat = (document.getElementById('colab-mat') ? document.getElementById('colab-mat').value.trim().toLowerCase() : '');
      const nom = (document.getElementById('colab-nom') ? document.getElementById('colab-nom').value.trim().toLowerCase() : '');

      const all = DB.colaboradores();
      COLAB_SEARCH_RESULTS = all.filter(c => {
        const matchPat = !pat || (c.paterno && c.paterno.toLowerCase().includes(pat));
        const matchMat = !mat || (c.materno && c.materno.toLowerCase().includes(mat));
        const matchNom = !nom || (c.nombres && c.nombres.toLowerCase().includes(nom));
        return matchPat && matchMat && matchNom;
      });
      renderEditAreaModal('responsables');
    }

    function draftAgregarColaborador(personal) {
      const colab = DB.colaboradores().find(c => c.personal === personal);
      if (!colab) return;

      const exists = DRAFT_AREA.responsables.find(r => r.personal === personal);
      if (exists) {
        APP.toast({ icon: '⚠️', title: 'Ya está asignado', body: `${colab.nombres} ya figura en la lista de responsables de esta área.` });
        return;
      }

      const defaultSede = (DRAFT_AREA.sedes && DRAFT_AREA.sedes.length > 0)
        ? DRAFT_AREA.sedes[0].nombre
        : '7803-2 --> LOCAL 1 / Jr. Larrabure y Unanue 110 Santa Beatriz, Lima';

      DRAFT_AREA.responsables.push({
        id: 'RESP-' + Date.now(),
        personal: colab.personal,
        nombre: `${colab.paterno} ${colab.materno}, ${colab.nombres}`.trim(),
        sede: defaultSede,
        cargo: 'Responsable',
        activo: true
      });

      APP.toast({ icon: '👤', title: 'Responsable agregado', body: `${colab.paterno} ${colab.materno} fue añadido a la tabla.` });
      renderEditAreaModal('responsables');
    }

    function confirmarQuitarResponsable(idx) {
      syncDraftGeneralFields();
      if (!DRAFT_AREA || !DRAFT_AREA.responsables || !DRAFT_AREA.responsables[idx]) return;
      const r = DRAFT_AREA.responsables[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Responsable del Área',
        icono: SVG_ICONS.warn,
        mensaje: `¿Estás seguro de que deseas retirar a <b>«${r.nombre}»</b> (${r.cargo}) del equipo de responsables de esta área?`,
        textoBoton: 'Sí, Quitar Responsable',
        onConfirm: () => {
          DRAFT_AREA.responsables.splice(idx, 1);
          cerrarConfirmacionModal();
          renderEditAreaModal('responsables');
          APP.toast({ icon: '🗑️', title: 'Responsable retirado', body: 'Se retiró al colaborador del área.' });
        }
      });
    }

    function draftCambiarResponsable(idx, campo, val) {
      if (DRAFT_AREA.responsables[idx]) {
        DRAFT_AREA.responsables[idx][campo] = (campo === 'activo' ? (val === 'si' || val === true) : val);
      }
    }

    function guardarEdicionArea(id) {
      syncDraftGeneralFields();

      if (!DRAFT_AREA.nombre) {
        APP.toast({ icon: '⚠️', title: 'Falta el nombre', body: 'El área debe tener un título o nombre válido.' });
        setSubtabEditArea('general');
        return;
      }

      DB.upsertArea(DRAFT_AREA);
      APP.closeModal();
      APP.toast({ icon: '🏢', title: 'Área actualizada', body: `«${DRAFT_AREA.nombre}» guardada con sedes y responsables.` });
      render();
    }

    // -------------------------------------------------------------------------
    // 3. EL "OJO": VER FICHA COMPLETA DEL ÁREA (Card / Modal Detalle)
    // -------------------------------------------------------------------------
    function verDetalleArea(id) {
      const a = DB.getArea(id);
      if (!a) return;

      const sedesChips = (a.sedes || []).map(s => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border-radius:8px;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--brand);display:inline-flex;align-items:center">${SVG_ICONS.sede}</span>
            <span style="font-size:13px;font-weight:600">${s.nombre}</span>
          </div>
          ${s.activo ? '<span class="pill ok" style="font-size:11px">Activo</span>' : '<span class="pill gray" style="font-size:11px">Inactivo</span>'}
        </div>
      `).join('') || `<span class="muted" style="font-size:12.5px">Sin sedes asociadas</span>`;

      const respRows = (a.responsables || []).map((r, idx) => {
        let cargoBadge = '<span class="tag teal">Responsable</span>';
        if (r.cargo === 'Coordinador') cargoBadge = '<span class="tag purple">Coordinador</span>';
        else if (r.cargo === 'Reporteador') cargoBadge = '<span class="tag">Reporteador</span>';

        return `
          <tr>
            <td style="text-align:center"><span class="mono muted">${idx + 1}</span></td>
            <td><span class="mono" style="font-weight:700;color:var(--brand-dark)">${r.personal || '-'}</span></td>
            <td><b>${r.nombre}</b></td>
            <td><span style="font-size:12px;color:var(--text-soft)">${r.sede || '-'}</span></td>
            <td>${cargoBadge}</td>
            <td style="text-align:center">${r.activo ? '<span class="pill ok" style="font-size:11px">Activo</span>' : '<span class="pill gray" style="font-size:11px">Inactivo</span>'}</td>
          </tr>
        `;
      }).join('');

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              ${SVG_ICONS.sede}
            </div>
            <div>
              <h3>${a.nombre}</h3>
              <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
                <span class="mono" style="font-size:11px;background:#F1F5F9;border:1px solid #CBD5E1;border-radius:4px;padding:1px 6px;color:var(--brand-dark);font-weight:700">${a.codigo || a.id}</span>
                <span style="font-size:12px;color:var(--text-muted)">${a.institucion || 'Universidad Privada Norbert Wiener S.A.'}</span>
                ${a.activo ? '<span class="pill ok">Activo</span>' : '<span class="pill gray">Inactivo</span>'}
              </div>
            </div>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>

        <div class="modal-body" style="max-height:80vh;overflow-y:auto">
          <!-- Bloque Observación -->
          <div class="detail-card-info">
            <div class="section-label" style="margin:0 0 6px 0">Observación / Funciones del Área</div>
            <div style="font-size:13.5px;color:var(--text-soft);line-height:1.5">
              ${a.observacion || '<span class="muted">Sin observaciones o descripción institucional registrada.</span>'}
            </div>
            <div style="margin-top:10px;font-size:12px;color:var(--text-muted)">
              Fecha de Registro Oficial: <b>${a.fechaRegistro || '2022-06-10'}</b>
            </div>
          </div>

          <!-- Bloque Sedes -->
          <div class="detail-card-info">
            <div class="section-label" style="margin:0 0 10px 0">Sedes y Ventanillas Asignadas (${(a.sedes || []).length})</div>
            ${sedesChips}
          </div>

          <!-- Bloque Responsables -->
          <div class="detail-card-info" style="margin-bottom:0">
            <div class="section-label" style="margin:0 0 10px 0">Equipo de Responsables Asignados (${(a.responsables || []).length})</div>
            <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:8px">
              <table class="modal-table" style="margin:0">
                <thead>
                  <tr>
                    <th style="width:40px;text-align:center">N°</th>
                    <th style="width:95px">Personal</th>
                    <th>Apellidos y Nombres</th>
                    <th>Sede de Atención</th>
                    <th style="width:130px">Cargo / Rol</th>
                    <th style="width:85px;text-align:center">Estado</th>
                  </tr>
                </thead>
                <tbody>
                  ${respRows.length ? respRows : `<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted)">No hay responsables asignados a esta área.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="modal-foot" style="display:flex;justify-content:space-between;align-items:center">
          <button class="btn" onclick="APP.closeModal()">Cerrar</button>
          <button class="btn btn-primary" style="display:inline-flex;align-items:center;gap:6px" onclick="APP.closeModal(); editarArea('${id}')">${SVG_ICONS.edit} Editar Área</button>
        </div>
      `, { wide: true });
    }

    // -------------------------------------------------------------------------
    // 4. CONFIRMACIÓN Y ELIMINACIÓN DE ÁREA
    // -------------------------------------------------------------------------
    function eliminarArea(id) {
      const a = DB.getArea(id);
      if (!a) return;

      const tramitesUsan = DB.tramites().filter(t => t.area === a.nombre || (t.proceso && t.proceso.some(p => p.area === a.nombre)));
      const cantUsos = tramitesUsan.length;

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:var(--warn-fg);display:inline-flex;align-items:center">${SVG_ICONS.warn}</span>
            <h3>Confirmar Eliminación de Área</h3>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="font-size:14px;color:var(--text);margin-bottom:12px">
            ¿Estás seguro de que deseas eliminar permanentemente el área <b>«${a.nombre}»</b> (Código: <code>${a.codigo || a.id}</code>)?
          </p>

          ${cantUsos > 0 ? `
            <div class="alert warn" style="margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:4px">
                ${SVG_ICONS.warn} Advertencia Institucional:
              </div>
              <div>Esta área se encuentra referenciada en <b>${cantUsos} trámite(s)</b> institucional(es):</div>
              <ul style="margin:6px 0 0 16px;padding:0">
                ${tramitesUsan.slice(0, 3).map(t => `<li>${t.nombre}</li>`).join('')}
                ${cantUsos > 3 ? `<li>... y ${cantUsos - 3} trámite(s) más.</li>` : ''}
              </ul>
              <div style="margin-top:6px;font-size:12px">Eliminarla puede afectar el flujo secuencial de revisión de solicitudes vinculadas.</div>
            </div>
          ` : `
            <div class="alert info" style="margin-bottom:14px">
              Esta área no tiene trámites activos bloqueándola. Se eliminarán sus sedes y equipo de responsables asignados.
            </div>
          `}

          <div style="font-size:12.5px;color:var(--text-muted)">Esta acción no se puede deshacer.</div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="APP.closeModal()">Cancelar</button>
          <button class="btn btn-danger" style="display:inline-flex;align-items:center;gap:6px" onclick="confirmarEliminarArea('${id}')">${SVG_ICONS.trash} Sí, Eliminar definitivamente</button>
        </div>
      `, { wide: false });
    }

    function confirmarEliminarArea(id) {
      const a = DB.getArea(id);
      const nombre = a ? a.nombre : 'Área';
      DB.deleteArea(id);
      APP.closeModal();
      APP.toast({ icon: '🗑️', title: 'Área eliminada', body: `«${nombre}» fue retirada del sistema.` });
      render();
    }

    render();
  </script>
</body>
</html>
