<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseñar trámites · Wiener Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Tabs de navegación estilo Wiener */
    .tabs-header {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--border-soft);
      padding-bottom: 4px;
    }
    .tab-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 10px 10px 0 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Lato', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .tab-nav-btn:hover {
      color: var(--brand);
      background: var(--surface-2);
    }
    .tab-nav-btn.active {
      color: var(--brand-dark);
      background: var(--surface);
      border-bottom: 3px solid var(--brand);
      margin-bottom: -6px;
    }
    .tab-nav-btn .count-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text-soft);
    }
    .tab-nav-btn.active .count-badge {
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    /* Barra de filtros y búsqueda */
    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text-soft);
      font-weight: 500;
    }
    .filter-input {
      padding: 8px 12px;
      font-size: 13.5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #FFF;
      outline: none;
      min-width: 220px;
    }
    .filter-select {
      padding: 8px 12px;
      font-size: 13.5px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #FFF;
      outline: none;
    }

    /* Custom select look & feel en barra de filtros */
    .filter-card .select-wrap.inline,
    .filter-card .custom-select-wrap {
      width: 135px !important;
      margin: 0 !important;
      display: inline-block !important;
      vertical-align: middle !important;
    }
    .filter-card .custom-select-trigger {
      height: 38px !important;
      min-height: 38px !important;
      max-height: 38px !important;
      border-radius: 8px !important;
      padding: 0 32px 0 12px !important;
      display: flex !important;
      align-items: center !important;
      background: #FFFFFF !important;
      font-size: 13.5px !important;
      border: 1px solid var(--border) !important;
      box-sizing: border-box !important;
    }
    .filter-card .custom-select-label {
      line-height: 36px !important;
      font-size: 13.5px !important;
    }
    .filter-card .custom-select-arrow {
      right: 12px !important;
    }
    .filter-card .custom-select-menu {
      min-width: 135px !important;
      z-index: 200 !important;
      border-radius: 8px !important;
    }

    /* Mini etiquetas y badges */
    .concept-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      color: #334155;
      font-family: monospace;
    }
    .flow-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 1px solid #BFE6E9;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .action-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-icon-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFF;
      color: var(--text-soft);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-icon-action:hover {
      background: var(--surface-2);
      border-color: var(--brand);
      color: var(--brand-dark);
    }
    .btn-icon-action.highlight {
      background: var(--brand-soft);
      border-color: var(--brand);
      color: var(--brand-dark);
    }
    .avatar-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF;
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 3px 9px 3px 4px;
      font-size: 12px;
      margin: 2px 4px 2px 0;
    }
    .avatar-mini {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--brand);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 700;
    }

    /* Tablas modales */
    .modal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }
    .modal-table th {
      background: var(--surface-2);
      padding: 9px 12px;
      text-align: left;
      font-weight: 700;
      color: var(--text-soft);
      border-bottom: 2px solid var(--border);
    }
    .modal-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .modal-table tr:hover td {
      background: #FAFAFA;
    }


    /* Modal Wide con ancho optimizado para evitar cortes de información */
    .modal.wide {
      max-width: 960px !important;
      width: 96% !important;
    }

    /* Switch toggle compacto para tablas */
    .switch.switch-sm {
      width: 36px;
      height: 20px;
      display: inline-block;
      vertical-align: middle;
      margin: 0;
    }
    .switch.switch-sm .slider::before {
      height: 14px;
      width: 14px;
      left: 3px;
      top: 3px;
    }
    .switch.switch-sm input:checked + .slider::before {
      transform: translateX(16px);
    }

    /* Subtabs internas de modales estilo Wiener */
    .modal-subnav {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid var(--border-soft);
      margin-bottom: 20px;
    }
    .modal-subnav-btn {
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      font-family: 'Lato', sans-serif;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-bottom: -2px;
      border-radius: 6px 6px 0 0;
    }
    .modal-subnav-btn svg {
      flex-shrink: 0;
    }
    .modal-subnav-btn:hover {
      color: var(--brand);
      background: var(--surface-2);
    }
    .modal-subnav-btn.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
      background: #FFFFFF;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.03);
    }
    .char-limit-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }
    .search-panel-box {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .btn-circle-del {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #FEE2E2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
    }
    .btn-circle-del:hover {
      background: #DC2626;
      color: #FFF;
    }
    .btn-circle-add {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
    }
    .btn-circle-add:hover {
      background: #047857;
      color: #FFF;
    }
    .detail-card-info {
      background: #FFF;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }

    /* Botones de acción y jerarquía visual Wiener */
    .btn-dark {
      background: #0F172A;
      border: 1px solid #0F172A;
      color: #FFFFFF;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-dark:hover {
      background: #1E293B;
      border-color: #1E293B;
      color: #FFFFFF;
    }
    .btn-search-bar {
      height: 38px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 8px;
      background: #0F172A;
      border: 1px solid #0F172A;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-search-bar:hover {
      background: #1E293B;
      border-color: #1E293B;
    }
    .btn-new-bar {
      height: 38px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }

    /* Grilla de 4 acciones (2 arriba, 2 abajo) del mismo tamaño + botón eliminar */
    .action-cell-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 74px);
      gap: 4px;
    }
    .btn-grid-act {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 74px;
      height: 27px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-grid-act:hover {
      background: var(--surface-2);
      border-color: var(--brand);
      color: var(--brand-dark);
    }
    .btn-grid-act svg {
      flex-shrink: 0;
      color: var(--brand-dark);
    }
    .btn-grid-del {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 58px;
      border-radius: 6px;
      border: 1px solid #FCA5A5;
      background: #FEE2E2;
      color: #DC2626;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-grid-del:hover {
      background: #FCA5A5;
      color: #991B1B;
    }

    /* Editor de texto enriquecido (RTE) */
    .rte-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #FFF;
    }
    .rte-bar {
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .rte-tool-btn {
      background: #FFF;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      user-select: none;
    }
    .rte-tool-btn:hover {
      background: #E2E8F0;
      color: var(--brand-dark);
    }
    .rte-editor-area {
      width: 100%;
      min-height: 110px;
      padding: 10px 12px;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13.5px;
      resize: vertical;
      line-height: 1.5;
      box-sizing: border-box;
    }

    /* Tarjetas de cronograma sistema de diseño Wiener */
    .cronog-card-wiener {
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      background: #FFFFFF;
      margin-bottom: 14px;
      overflow: visible !important;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }
    .cronog-card-wiener > div:first-child {
      border-top-left-radius: 9px;
      border-top-right-radius: 9px;
    }
    .cronog-card-wiener:hover {
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/doc.js"></script>
  <script>
    const ctx = APP.renderShell('tramites');
    const TABS_VALIDAS = ['tramites', 'areas', 'requisitos'];
    const tabUrl = new URLSearchParams(location.search).get('tab');
    let ACTIVE_TAB = TABS_VALIDAS.includes(tabUrl) ? tabUrl : 'tramites';
    let SEARCH_QUERY = '';
    let FILTER_ESTADO = 'todos';

    // Íconos SVG reutilizables para toda la interfaz
    const SVG_ICONS = {
      edit: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`,

      trash: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
      sede: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9h1M9 13h1M9 17h1"/></svg>`,
      user: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      cross: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      search: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
      doc: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
      tramiteTab: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>`,
      requisitoTab: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
      warn: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`,
      proceso: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
      cronograma: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="2"/></svg>`,
      correo: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
      dots: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`,
      minus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>`
    };

    function updateCharCounter(elId, len, max = 500) {
      const el = document.getElementById(elId);
      if (el) el.textContent = `${len} / ${max} caracteres (máx. ${max})`;
    }

    function mostrarConfirmacionModal({ titulo, icono, mensaje, textoBoton, onConfirm }) {
      cerrarConfirmacionModal();
      const ov = document.createElement('div');
      ov.id = 'confirm-modal-backdrop';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;animation:pop .15s ease;';
      ov.innerHTML = `
        <div class="modal" style="max-width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);border:1px solid var(--border-soft);background:#FFFFFF;border-radius:12px;overflow:hidden">
          <div class="modal-head" style="padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="color:var(--warn-fg);display:inline-flex;align-items:center">${icono || SVG_ICONS.warn}</span>
              <h3 style="margin:0;font-size:16px">${titulo}</h3>
            </div>
            <button class="modal-close" type="button" onclick="cerrarConfirmacionModal()">×</button>
          </div>
          <div class="modal-body" style="padding:18px;font-size:13.5px;color:var(--text);line-height:1.45">
            ${mensaje}
          </div>
          <div class="modal-foot" style="padding:12px 18px;background:var(--surface-2);border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px">
            <button class="btn btn-sm" type="button" onclick="cerrarConfirmacionModal()">Cancelar</button>
            <button class="btn btn-sm btn-danger" type="button" id="btn-confirm-action" style="display:inline-flex;align-items:center;gap:6px">
              ${SVG_ICONS.trash} ${textoBoton || 'Eliminar'}
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(ov);
      ov.addEventListener('click', (e) => {
        if (e.target === ov) cerrarConfirmacionModal();
      });
      document.getElementById('btn-confirm-action').onclick = onConfirm;
    }

    function cerrarConfirmacionModal() {
      const el = document.getElementById('confirm-modal-backdrop');
      if (el) el.remove();
    }

    // =========================================================================
    // RENDER PRINCIPAL
    // =========================================================================
    function render() {
      if (!ctx) return;
      const ts = DB.tramites();
      const areas = DB.areas();
      const reqs = DB.requisitos();

      ctx.mount.innerHTML = `
        <div class="page-head">
          <div>
            <h1>Diseñar trámites</h1>
            <p>Arma cada trámite como un recorrido: qué entrega el alumno, cuándo paga, qué áreas lo revisan y qué recibe al final.</p>
          </div>
          <a class="btn btn-primary" href="tramite-editor.html">${SVG_ICONS.plus} <span>Nuevo trámite</span></a>
        </div>

        ${APP.tabsHTML([
          { id: 'tramites', label: 'Trámites', count: ts.length },
          { id: 'areas', label: 'Áreas y responsables', count: areas.length },
          { id: 'requisitos', label: 'Catálogo de requisitos', count: reqs.length }
        ], ACTIVE_TAB, 'setTab')}

        <div id="tab-content">
          ${renderTabContent()}
        </div>
      `;

      if (APP && APP.initCustomSelects) {
        APP.initCustomSelects(ctx.mount);
      }
      if (APP && APP.initDatePickers) {
        APP.initDatePickers(ctx.mount);
      }
    }

    function setTab(tab) {
      ACTIVE_TAB = tab;
      SEARCH_QUERY = '';
      FILTER_ESTADO = 'todos';
      history.replaceState(null, '', tab === 'tramites' ? 'tramites.html' : 'tramites.html?tab=' + tab);
      render();
    }

    function renderTabContent() {
      if (ACTIVE_TAB === 'tramites') return renderTramitesTab();
      if (ACTIVE_TAB === 'areas') return renderAreasTab();
      if (ACTIVE_TAB === 'requisitos') return renderRequisitosTab();
      return '';
    }

    // =========================================================================
    // SECCIÓN 1: TRÁMITES (lista con el recorrido de cada uno)
    // =========================================================================
    function textoPlano(html) { return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }

    function tramitesFiltrados() {
      let ts = DB.tramites();
      const q = SEARCH_QUERY.toLowerCase();
      if (q) {
        ts = ts.filter(t => [t.nombre, t.id, t.area, t.observacion, textoPlano(t.descripcion), t.tipo].some(v => v && String(v).toLowerCase().includes(q)));
      }
      if (FILTER_ESTADO === 'activo') ts = ts.filter(t => t.activo);
      if (FILTER_ESTADO === 'inactivo') ts = ts.filter(t => !t.activo);
      if (FILTER_ESTADO === 'incompleto') ts = ts.filter(t => DB.validarTramite(t).some(p => p.nivel === 'error'));
      return ts;
    }

    function tramiteCard(t) {
      const E = APP.esc;
      const errores = DB.validarTramite(t).filter(p => p.nivel === 'error').length;
      const desc = textoPlano(t.descripcion);
      const cuando = !(t.costo > 0) ? 'Gratuito' : APP.money(t.costo) + ', ' + DB.momentoPagoTexto(t).replace(/^S/, 's');
      return `
        <article class="list-card">
          <div class="list-card-head">
            <div style="min-width:0;flex:1">
              <h2 class="list-card-title">${E(t.nombre)}</h2>
              <div class="list-card-meta">
                <span>${E(t.tipo || 'Trámite')}</span>
                <span>${E(cuando)}</span>
                <span>${E(t.area || 'Sin área')}</span>
                <span>${E(DB.audienciaTexto(t.audiencia).join(', '))}</span>
                ${t.tipoActivacion === 'Cronograma' ? '<span>Solo en fechas programadas</span>' : ''}
              </div>
              ${desc ? `<p class="help" style="margin:8px 0 0">${E(desc.length > 160 ? desc.slice(0, 160) + '...' : desc)}</p>` : ''}
              ${t.observacion ? `<p class="help" style="margin:4px 0 0">Nota interna: ${E(t.observacion)}</p>` : ''}
            </div>
            <div class="btn-row">
              ${errores ? `<span class="pill warn" title="Abre el diseñador para ver qué falta">Faltan ${errores} ${errores === 1 ? 'punto' : 'puntos'}</span>` : ''}
              ${t.activo ? '<span class="pill ok">Visible</span>' : '<span class="pill gray">No visible</span>'}
            </div>
          </div>
          <div class="list-card-flow">${APP.flowHTML(t, { compact: true })}</div>
          <div class="btn-row" style="margin-top:14px">
            <a class="btn btn-sm btn-primary" href="tramite-proceso.html?id=${encodeURIComponent(t.id)}">${SVG_ICONS.edit} <span>Configurar</span></a>
            <button type="button" class="btn btn-sm btn-outline" onclick="duplicarTramite('${E(t.id)}')">Duplicar</button>
            <button type="button" class="btn btn-sm btn-outline" onclick="alternarTramite('${E(t.id)}')">${t.activo ? 'Ocultar a los alumnos' : 'Mostrar a los alumnos'}</button>
            <button type="button" class="btn btn-sm btn-outline" onclick="eliminarTramite('${E(t.id)}')" style="color:var(--err-fg)">${SVG_ICONS.trash} <span>Eliminar</span></button>
            <span class="help" style="margin-left:auto">${E(t.id)} · ${APP.fechaCorta(t.fechaRegistro)}</span>
          </div>
        </article>`;
    }

    function listaTramitesHTML() {
      const ts = tramitesFiltrados();
      if (!ts.length) {
        return `<div class="empty-state">
          <h3>${DB.tramites().length ? 'Ningún trámite coincide con la búsqueda' : 'Todavía no hay trámites'}</h3>
          <p>${DB.tramites().length ? 'Prueba con otra palabra o quita los filtros.' : 'Crea el primero a partir de una plantilla.'}</p>
          ${DB.tramites().length
            ? '<button type="button" class="btn btn-outline" onclick="limpiarFiltroTramites()">Quitar filtros</button>'
            : '<a class="btn btn-primary" href="tramite-editor.html">Nuevo trámite</a>'}
        </div>`;
      }
      return ts.map(tramiteCard).join('') + `<p class="help" style="margin-top:12px">${ts.length} de ${DB.tramites().length} trámites</p>`;
    }

    function renderTramitesTab() {
      return `
        <div class="filters-bar">
          <div class="search">
            <label class="sr-only" for="search-tramite-kw">Buscar trámite</label>
            <span class="s-ico">${SVG_ICONS.search}</span>
            <input class="input" id="search-tramite-kw" placeholder="Buscar por nombre, descripción, área o código" value="${APP.esc(SEARCH_QUERY)}" oninput="buscarTramite()">
          </div>
          <div style="width:220px">
            <label class="sr-only" for="filter-tramite-estado">Mostrar</label>
            <select class="select" id="filter-tramite-estado" onchange="buscarTramite()">
              <option value="todos" ${FILTER_ESTADO === 'todos' ? 'selected' : ''}>Todos</option>
              <option value="activo" ${FILTER_ESTADO === 'activo' ? 'selected' : ''}>Visibles para alumnos</option>
              <option value="inactivo" ${FILTER_ESTADO === 'inactivo' ? 'selected' : ''}>No visibles</option>
              <option value="incompleto" ${FILTER_ESTADO === 'incompleto' ? 'selected' : ''}>Con puntos pendientes</option>
            </select>
          </div>
        </div>
        <div id="lista-tramites">${listaTramitesHTML()}</div>
      `;
    }

    // Solo se re-pinta la lista: el buscador conserva foco y texto
    function buscarTramite() {
      const kw = document.getElementById('search-tramite-kw');
      const es = document.getElementById('filter-tramite-estado');
      SEARCH_QUERY = kw ? kw.value.trim() : '';
      FILTER_ESTADO = es ? es.value : 'todos';
      const lista = document.getElementById('lista-tramites');
      if (lista) lista.innerHTML = listaTramitesHTML();
    }

    function limpiarFiltroTramites() {
      SEARCH_QUERY = ''; FILTER_ESTADO = 'todos';
      render();
    }

    function duplicarTramite(id) {
      const c = DB.duplicarTramite(id);
      if (!c) return;
      APP.toast('Trámite duplicado', 'Se creó «' + APP.esc(c.nombre) + '» como borrador no visible. Ábrelo para ajustarlo.', 'ok');
      render();
    }

    function alternarTramite(id) {
      const t = DB.getTramite(id);
      if (!t) return;
      if (!t.activo) {
        const errores = DB.validarTramite(t).filter(p => p.nivel === 'error');
        if (errores.length) {
          APP.confirm({
            title: 'Aún no se puede mostrar',
            body: 'A «' + APP.esc(t.nombre) + '» le faltan ' + errores.length + ' puntos:<ul style="margin:10px 0 0 18px">' + errores.map(p => '<li>' + APP.esc(p.msg) + '</li>').join('') + '</ul>',
            confirmLabel: 'Abrir el diseñador', cancelLabel: 'Cerrar',
            onConfirm: () => { location.href = 'tramite-proceso.html?id=' + encodeURIComponent(id); }
          });
          return;
        }
        DB.setTramiteActivo(id, true);
        APP.toast('Trámite visible', 'Los alumnos a quienes va dirigido ya pueden solicitarlo.', 'ok');
        render();
        return;
      }
      APP.confirm({
        title: 'Ocultar a los alumnos',
        body: '«' + APP.esc(t.nombre) + '» dejará de aparecer en el catálogo de los alumnos. Las solicitudes ya registradas siguen su curso.',
        confirmLabel: 'Ocultar',
        onConfirm: () => { DB.setTramiteActivo(id, false); APP.toast('Trámite oculto', 'Ya no aparece en el catálogo de los alumnos.', 'ok'); render(); }
      });
    }

    // =========================================================================
    // SECCIÓN 2: ÁREAS Y RESPONSABLES
    // =========================================================================
    function renderAreasTab() {
      let areas = DB.areas();
      if (SEARCH_QUERY) {
        const q = SEARCH_QUERY.toLowerCase();
        areas = areas.filter(a => a.nombre.toLowerCase().includes(q) || (a.observacion && a.observacion.toLowerCase().includes(q)) || (a.codigo && a.codigo.toLowerCase().includes(q)));
      }
      if (FILTER_ESTADO !== 'todos') {
        const act = FILTER_ESTADO === 'activo';
        areas = areas.filter(a => Boolean(a.activo) === act);
      }

      const rows = areas.map((a, idx) => {
        const sedesCount = (a.sedes || []).length;
        const respCount = (a.responsables || []).length;

        return `
          <tr>
            <td style="text-align:center"><span class="mono muted" style="font-size:13px">${idx + 1}</span></td>
            <td>
              <div class="strong" style="font-size:14px;color:var(--text);line-height:1.35;margin-bottom:4px">${a.nombre}</div>
              <div style="display:inline-flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted);font-weight:500">
                <span style="display:inline-flex;align-items:center;gap:4px;color:var(--brand-dark)">${SVG_ICONS.sede} ${sedesCount} sede(s)</span>
                <span style="display:inline-flex;align-items:center;gap:4px;color:var(--brand-dark)">${SVG_ICONS.user} ${respCount} responsable(s)</span>
              </div>
            </td>
            <td>
              <div style="font-size:13px;color:var(--text-soft);line-height:1.45">
                ${a.observacion || '<span class="muted">-</span>'}
              </div>
            </td>
            <td style="text-align:center">
              <span class="muted" style="font-size:12.5px;white-space:nowrap">${a.fechaRegistro || '2022-06-10'}</span>
            </td>
            <td style="text-align:center">
              ${a.activo ? '<span class="pill ok">Activo</span>' : '<span class="pill gray">Inactivo</span>'}
            </td>
            <td style="text-align:center;white-space:nowrap">
              <div style="display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap">
                <button class="btn btn-sm btn-outline" style="padding:5px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap" title="Editar datos del área, sedes y responsables" aria-label="Editar datos del área, sedes y responsables" onclick="editarArea('${a.id}')">
                  ${SVG_ICONS.edit} <span>Editar</span>
                </button>
                <button class="btn btn-sm" style="background:#F1F5F9;border:1px solid #CBD5E1;color:#334155;padding:5px 8px;display:inline-flex;align-items:center;justify-content:center" title="Ver ficha completa y todo lo configurado" aria-label="Ver ficha completa y todo lo configurado" onclick="verDetalleArea('${a.id}')">
                  ${SVG_ICONS.eye}
                </button>
                <button class="btn btn-sm" style="background:#FEE2E2;border:1px solid #FCA5A5;color:#DC2626;padding:5px 8px;display:inline-flex;align-items:center;justify-content:center" title="Eliminar área institucional" aria-label="Eliminar área institucional" onclick="eliminarArea('${a.id}')">
                  ${SVG_ICONS.trash}
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="filter-card">
          <div class="filter-group">
            <div class="filter-item">
              <span>Buscar:</span>
              <input class="filter-input" id="search-area-kw" placeholder="Nombre del área u observación" value="${SEARCH_QUERY}" onkeyup="if(event.key==='Enter') buscarArea()">
            </div>
            <div class="filter-item">
              <span>Mostrar:</span>
              <div class="select-wrap inline" style="margin:0;width:135px">
                <select class="filter-select" id="filter-area-estado" onchange="buscarArea()">
                  <option value="todos" ${FILTER_ESTADO === 'todos' ? 'selected' : ''}>Todos</option>
                  <option value="activo" ${FILTER_ESTADO === 'activo' ? 'selected' : ''}>Activo</option>
                  <option value="inactivo" ${FILTER_ESTADO === 'inactivo' ? 'selected' : ''}>Inactivo</option>
                </select>
              </div>
            </div>
            <button class="btn btn-search-bar" onclick="buscarArea()">${SVG_ICONS.search} <span>Buscar</span></button>
          </div>
          <button class="btn btn-primary btn-new-bar" onclick="nuevaArea()">${SVG_ICONS.plus} <span>Nueva área</span></button>
        </div>

        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th style="width:45px;text-align:center">N°</th>
                <th style="min-width:240px;width:28%">Área</th>
                <th>Observación</th>
                <th style="width:115px;text-align:center">Fecha reg.</th>
                <th style="width:95px;text-align:center">Estado</th>
                <th style="width:200px;text-align:center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows : `<tr><td colspan="6" style="text-align:center;padding:34px;color:var(--text-muted)">No se encontraron áreas con el criterio de búsqueda.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="margin-top:12px;font-size:13px;color:var(--text-muted);font-weight:600">${areas.length} áreas</div>
      `;
    }

    function buscarArea() {
      SEARCH_QUERY = document.getElementById('search-area-kw') ? document.getElementById('search-area-kw').value.trim() : '';
      FILTER_ESTADO = document.getElementById('filter-area-estado') ? document.getElementById('filter-area-estado').value : 'todos';
      render();
    }

    // =========================================================================
    // SECCIÓN 3: REQUISITOS (Catálogo Maestro)
    // =========================================================================
    function renderRequisitosTab() {
      let reqs = DB.requisitos();
      if (SEARCH_QUERY) {
        const q = SEARCH_QUERY.toLowerCase();
        reqs = reqs.filter(r => r.titulo.toLowerCase().includes(q) || (r.observacion && r.observacion.toLowerCase().includes(q)));
      }
      if (FILTER_ESTADO !== 'todos') {
        const act = FILTER_ESTADO === 'activo';
        reqs = reqs.filter(r => Boolean(r.activo) === act);
      }

      const rows = reqs.map((r, idx) => `
        <tr>
          <td style="text-align:center"><span class="mono muted" style="font-size:13px">${idx + 1}</span></td>
          <td>
            <div class="strong" style="font-size:14px;color:var(--text);line-height:1.35">${r.titulo}</div>
          </td>
          <td>
            <div style="font-size:12.5px;color:var(--text-soft);line-height:1.45">${r.observacion || '<span class="muted">-</span>'}</div>
          </td>
          <td>
            ${r.requiereAdjunto ? `
              <div>
                <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand-dark)">
                  <span style="color:var(--brand);flex-shrink:0;display:inline-flex;align-items:center">${SVG_ICONS.doc}</span>
                  <span style="word-break:break-word">${r.adjuntoNombre || 'Archivo adjunto'}</span>
                </div>
                <div style="margin-top:4px">
                  <span class="tag gray" style="font-size:10px;padding:1px 6px;font-weight:700;letter-spacing:0.03em">${r.formato || 'PDF'}</span>
                </div>
              </div>
            ` : `<span class="muted" style="font-size:12px">No requiere archivo</span>`}
          </td>
          <td style="text-align:center">
            ${r.activo ? '<span class="pill ok">Activo</span>' : '<span class="pill gray">Inactivo</span>'}
          </td>
          <td style="text-align:center">
            <span class="muted" style="font-size:12.5px;white-space:nowrap">${r.fechaRegistro || '2026-06-10'}</span>
          </td>
          <td style="text-align:center;white-space:nowrap">
            <div style="display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap">
              <button class="btn btn-sm btn-outline" style="padding:5px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap" title="Editar requisito" aria-label="Editar requisito" onclick="editarRequisito('${r.id}')">
                ${SVG_ICONS.edit} <span>Editar</span>
              </button>
              <button class="btn btn-sm" style="background:#FEE2E2;border:1px solid #FCA5A5;color:#DC2626;padding:5px 8px;display:inline-flex;align-items:center;justify-content:center" title="Eliminar requisito" aria-label="Eliminar requisito" onclick="eliminarRequisito('${r.id}')">
                ${SVG_ICONS.trash}
              </button>
            </div>
          </td>
        </tr>
      `).join('');

      return `
        <div class="filter-card">
          <div class="filter-group">
            <div class="filter-item">
              <span>Buscar:</span>
              <input class="filter-input" id="search-req-kw" placeholder="Nombre del requisito" value="${SEARCH_QUERY}" onkeyup="if(event.key==='Enter') buscarRequisito()">
            </div>
            <div class="filter-item">
              <span>Mostrar:</span>
              <div class="select-wrap inline" style="margin:0;width:135px">
                <select class="filter-select" id="filter-req-estado" onchange="buscarRequisito()">
                  <option value="todos" ${FILTER_ESTADO === 'todos' ? 'selected' : ''}>Todos</option>
                  <option value="activo" ${FILTER_ESTADO === 'activo' ? 'selected' : ''}>Activo</option>
                  <option value="inactivo" ${FILTER_ESTADO === 'inactivo' ? 'selected' : ''}>Inactivo</option>
                </select>
              </div>
            </div>
            <button class="btn btn-search-bar" onclick="buscarRequisito()">${SVG_ICONS.search} <span>Buscar</span></button>
          </div>
          <button class="btn btn-primary btn-new-bar" onclick="editarRequisito(null)">${SVG_ICONS.plus} <span>Nuevo requisito</span></button>
        </div>

        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th style="width:45px;text-align:center">N°</th>
                <th style="min-width:230px;width:28%">Requisito</th>
                <th style="width:23%">Observación</th>
                <th style="min-width:160px;width:18%">Adjuntar Archivo</th>
                <th style="width:90px;text-align:center">Estado</th>
                <th style="width:120px;text-align:center">Fecha reg.</th>
                <th style="width:145px;text-align:center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows : `<tr><td colspan="7" style="text-align:center;padding:34px;color:var(--text-muted)">No se encontraron requisitos.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="margin-top:12px;font-size:13px;color:var(--text-muted);font-weight:600">${reqs.length} requisitos</div>
      `;
    }

    function buscarRequisito() {
      SEARCH_QUERY = document.getElementById('search-req-kw') ? document.getElementById('search-req-kw').value.trim() : '';
      FILTER_ESTADO = document.getElementById('filter-req-estado') ? document.getElementById('filter-req-estado').value : 'todos';
      render();
    }

    function eliminarTramite(id) {
      const t = DB.getTramite(id);
      if (!t) return;
      mostrarConfirmacionModal({
        titulo: 'Eliminar Trámite',

                <div class="field">

                    <option value="DOC" ${r.formato === 'DOC' ? 'selected' : ''}>DOC</option>
                    <option value="PNG" ${r.formato === 'PNG' ? 'selected' : ''}>PNG</option>
                    <option value="JPG" ${r.formato === 'JPG' ? 'selected' : ''}>JPG</option>

          <!-- HABILITAR CON SWITCH -->

    function toggleReqAdjuntoBox(checked) {
      const box = document.getElementById('adj-box-container');
      const nomInput = document.getElementById('req-adj-nom');
      const fmtSelect = document.getElementById('req-adj-fmt');
      if (box && nomInput && fmtSelect) {
        if (checked) {
          box.style.opacity = '1';
          box.style.background = '#F8FAFC';
          box.style.borderColor = '#CBD5E1';
          box.style.pointerEvents = 'auto';
          nomInput.disabled = false;
          fmtSelect.disabled = false;
          const trig = box.querySelector('.custom-select-trigger');
          if (trig) trig.disabled = false;
          nomInput.focus();
        } else {
          box.style.opacity = '0.55';
          box.style.background = '#F1F5F9';
          box.style.borderColor = '#E2E8F0';
          box.style.pointerEvents = 'none';
          nomInput.disabled = true;
          fmtSelect.disabled = true;
          const trig = box.querySelector('.custom-select-trigger');
          if (trig) trig.disabled = true;
        }
      }
    }

    function guardarRequisito(id) {
      const titulo = document.getElementById('req-titulo').value.trim();
      if (!titulo) {
        APP.toast({ icon: 'warn', title: 'Falta título', body: 'Ingresa la descripción del requisito.' });
        document.getElementById('req-titulo').focus();
        return;
      }

      const reqAdj = document.getElementById('req-chk-adj').checked;
      let adjNom = '';
      let fmt = '';
      if (reqAdj) {
        adjNom = document.getElementById('req-adj-nom').value.trim();
        fmt = document.getElementById('req-adj-fmt').value;
        if (!adjNom) {
          APP.toast({ icon: 'warn', title: 'Falta nombre de archivo', body: 'Ingresa el nombre del archivo adjunto requerido.' });
          document.getElementById('req-adj-nom').focus();
          return;
        }
        if (!fmt) {
          APP.toast({ icon: 'warn', title: 'Falta formato', body: 'Selecciona el formato admitido (PDF, DOC, PNG, JPG).' });
          document.getElementById('req-adj-fmt').focus();
          return;
        }
      }

      const r = {
        id: id || null,
        codigo: id ? document.getElementById('req-cod').value : '',
        titulo,
        observacion: document.getElementById('req-obs').value.trim(),
        requiereAdjunto: reqAdj,
        adjuntoNombre: adjNom,
        formato: fmt,
        activo: document.getElementById('req-habilitar').checked,
        fechaRegistro: (id && DB.getRequisito(id)) ? DB.getRequisito(id).fechaRegistro : new Date().toISOString().slice(0, 10)
      };

      DB.upsertRequisito(r);
      APP.closeModal();
      APP.toast({ icon: 'ok', title: id ? 'Requisito actualizado' : 'Requisito guardado', body: `«${titulo}» registrado en el catálogo maestro.` });
      render();
    }

    function eliminarRequisito(id) {
      const r = DB.getRequisito(id);
      if (!r) return;

      const tramitesUsan = DB.tramites().filter(t => {
        if (!t.requisitos) return false;
        return t.requisitos.some(item => (typeof item === 'string' && (item === r.id || item === r.titulo)) || (typeof item === 'object' && (item.id === r.id || item.titulo === r.titulo)));
      });
      const cantUsos = tramitesUsan.length;

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:var(--warn-fg);display:inline-flex;align-items:center">${SVG_ICONS.warn}</span>
            <h3>Confirmar Eliminación de Requisito</h3>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="font-size:14px;color:var(--text);margin-bottom:12px">
            ¿Estás seguro de que deseas eliminar permanentemente el requisito <b>«${r.titulo}»</b> (Código: <code>${r.codigo || r.id}</code>)?
          </p>

          ${cantUsos > 0 ? `
            <div class="alert warn" style="margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:4px">
                ${SVG_ICONS.warn} Advertencia Institucional:
              </div>
              <div>Este requisito está asociado a <b>${cantUsos} trámite(s)</b> institucional(es):</div>
              <ul style="margin:6px 0 0 16px;padding:0">
                ${tramitesUsan.slice(0, 3).map(t => `<li>${t.nombre}</li>`).join('')}
                ${cantUsos > 3 ? `<li>... y ${cantUsos - 3} trámite(s) más.</li>` : ''}
              </ul>
              <div style="margin-top:6px;font-size:12px">Eliminarlo afectará los requisitos configurados de dichos trámites.</div>
            </div>
          ` : `
            <div class="alert info" style="margin-bottom:14px">
              Este requisito no está siendo utilizado por ningún trámite activo y se puede retirar con total seguridad.
            </div>
          `}

          <div style="font-size:12.5px;color:var(--text-muted)">Esta acción no se puede deshacer.</div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="APP.closeModal()">Cancelar</button>
          <button class="btn btn-danger" style="display:inline-flex;align-items:center;gap:6px" onclick="confirmarEliminarRequisito('${id}')">
            ${SVG_ICONS.trash} Sí, Eliminar definitivamente
          </button>
        </div>
      `, { wide: false });
    }

    function confirmarEliminarRequisito(id) {
      const r = DB.getRequisito(id);
      const titulo = r ? r.titulo : 'Requisito';
      DB.deleteRequisito(id);
      APP.closeModal();
      APP.toast({ icon: 'ok', title: 'Requisito eliminado', body: `«${titulo}» fue retirado del catálogo.` });
      render();
    }

    // =========================================================================
    // SECCIÓN 2: GESTIÓN DE ÁREAS, SEDES Y RESPONSABLES
    // =========================================================================
    let DRAFT_AREA = null;
    let EDIT_AREA_SUBTAB = 'general'; // 'general' | 'sedes' | 'responsables'

    let COLAB_SEARCH_RESULTS = [];

    // -------------------------------------------------------------------------
    function nuevaArea() {
      const all = DB.areas();
      // máximo existente + 1: evita reutilizar el código de un área eliminada
      const nextNum = all.reduce((m, a) => Math.max(m, parseInt(String(a.id || '').replace(/\D/g, ''), 10) || 0), 0) + 1;
      const nextCod = 'A-' + String(nextNum).padStart(3, '0');

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px">

              <h3>Registrar Área</h3>

            </div>
            <div class="field full">
              <label>Observación</label>
              <textarea class="input" id="nueva-area-obs" rows="3" maxlength="500" placeholder="Ingrese como máximo 500 caracteres..." oninput="updateCharCounter('new-obs-count', this.value.length)"></textarea>

    function guardarNuevaArea(cod) {
      const nom = document.getElementById('nueva-area-nom') ? document.getElementById('nueva-area-nom').value.trim() : '';
      if (!nom) {
        APP.toast({ icon: 'warn', title: 'Falta el nombre', body: 'Ingresa el nombre o título de la nueva área.' });
        return;
      }
      const obs = document.getElementById('nueva-area-obs') ? document.getElementById('nueva-area-obs').value.trim() : '';
      const hab = document.getElementById('nueva-area-hab') ? document.getElementById('nueva-area-hab').value : 'si';
      const catSedes = DB.sedesCatalogo();

      const nueva = {
        id: cod,
        codigo: cod,
        institucion: 'Universidad Privada Norbert Wiener S.A.',
        nombre: nom,
        observacion: obs,
        activo: (hab === 'si'),
        fechaRegistro: new Date().toISOString().slice(0, 10),
        sedes: [
          { id: 'SED-1', nombre: catSedes[0] || '7803-2 --> LOCAL 1 / Jr. Larrabure y Unanue 110 Santa Beatriz, Lima', activo: true }
        ],
        responsables: []
      };

      DB.upsertArea(nueva);
      APP.closeModal();
      APP.toast({ icon: 'ok', title: 'Área creada', body: `«${nom}» registrada. Ahora puedes configurar sus Sedes y Responsables desde Editar.` });
      render();
    }

    // -------------------------------------------------------------------------
    // 2. FORMULARIO UNIFICADO DE EDICIÓN: DATOS, SEDES Y RESPONSABLES
    // -------------------------------------------------------------------------
    function editarArea(id, subtab) {
      const a = DB.getArea(id);
      if (!a) return;
      DRAFT_AREA = JSON.parse(JSON.stringify(a));
      if (!Array.isArray(DRAFT_AREA.sedes)) DRAFT_AREA.sedes = [];
      if (!Array.isArray(DRAFT_AREA.responsables)) DRAFT_AREA.responsables = [];
      SHOW_COLAB_SEARCH = false;
      COLAB_SEARCH_RESULTS = [];
      renderEditAreaModal(subtab || 'general');
    }

    function syncDraftGeneralFields() {
      const nomEl = document.getElementById('edit-area-nom');
      const obsEl = document.getElementById('edit-area-obs');
      const habEl = document.getElementById('edit-area-hab');
      if (nomEl) DRAFT_AREA.nombre = nomEl.value.trim();
      if (obsEl) DRAFT_AREA.observacion = obsEl.value.trim();
      if (habEl) DRAFT_AREA.activo = (habEl.value === 'si');
    }

    function setSubtabEditArea(subtab) {
      syncDraftGeneralFields();
      renderEditAreaModal(subtab);
    }

      let subContent = '';
      if (EDIT_AREA_SUBTAB === 'general') {
        const nomLen = (DRAFT_AREA.nombre || '').length;
        const obsLen = (DRAFT_AREA.observacion || '').length;

              <label>Institución</label>

              <label>Título / Nombre del Área *</label>

              <label>Observación</label>

              <label>Habilitar</label>
              <select class="select" id="edit-area-hab">

            </div>
          </div>

      } else if (EDIT_AREA_SUBTAB === 'sedes') {
        // Sub-vista 2: Sedes (Captura 2)

                <button type="button" class="btn-circle-del" title="Quitar sede" aria-label="Quitar sede" onclick="confirmarQuitarSede(${idx})">${SVG_ICONS.trash}</button>
              </td>
            </tr>
          `;
        }).join('');

        subContent = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
            <div>
              <div class="section-label" style="margin:0">Sedes Contenidas / Ventanillas</div>

    function draftAgregarSede() {
      const cat = DB.sedesCatalogo();
      const yaAsignadas = DRAFT_AREA.sedes.map(s => s.nombre);
      const dispo = cat.find(s => !yaAsignadas.includes(s)) || cat[0] || '7803-2 --> LOCAL 1 / Jr. Larrabure y Unanue 110 Santa Beatriz, Lima';
      DRAFT_AREA.sedes.push({
        id: 'SED-' + Date.now(),
        nombre: dispo,
        activo: true
      });
      renderEditAreaModal('sedes');
    }

    function confirmarQuitarSede(idx) {
      syncDraftGeneralFields();
      if (!DRAFT_AREA || !DRAFT_AREA.sedes || !DRAFT_AREA.sedes[idx]) return;
      if (DRAFT_AREA.sedes.length <= 1) {
        APP.toast({ icon: 'warn', title: 'Atención', body: 'El área debe contar con al menos una sede registrada.' });
        return;
      }
      const s = DRAFT_AREA.sedes[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Sede del Área',
        icono: SVG_ICONS.warn,
        mensaje: `¿Estás seguro de que deseas desvincular la sede <b>«${s.nombre}»</b> de esta área?`,
        textoBoton: 'Sí, Quitar Sede',
        onConfirm: () => {
          DRAFT_AREA.sedes.splice(idx, 1);
          cerrarConfirmacionModal();
          renderEditAreaModal('sedes');
          APP.toast({ icon: 'ok', title: 'Sede removida', body: 'Se actualizó la lista de sedes del área.' });
        }
      });
    }

    function draftCambiarSede(idx, campo, val) {
      if (DRAFT_AREA.sedes[idx]) {
        DRAFT_AREA.sedes[idx][campo] = (campo === 'activo' ? (val === 'si' || val === true) : val);
      }
    }

    function toggleColabSearch() {
      SHOW_COLAB_SEARCH = !SHOW_COLAB_SEARCH;
      if (SHOW_COLAB_SEARCH && COLAB_SEARCH_RESULTS.length === 0) {
        COLAB_SEARCH_RESULTS = DB.colaboradores().slice(0, 5);
      }
      renderEditAreaModal('responsables');
    }

    function buscarColaboradores() {
      const pat = (document.getElementById('colab-pat') ? document.getElementById('colab-pat').value.trim().toLowerCase() : '');
      const mat = (document.getElementById('colab-mat') ? document.getElementById('colab-mat').value.trim().toLowerCase() : '');
      const nom = (document.getElementById('colab-nom') ? document.getElementById('colab-nom').value.trim().toLowerCase() : '');

      const all = DB.colaboradores();
      COLAB_SEARCH_RESULTS = all.filter(c => {
        const matchPat = !pat || (c.paterno && c.paterno.toLowerCase().includes(pat));
        const matchMat = !mat || (c.materno && c.materno.toLowerCase().includes(mat));
        const matchNom = !nom || (c.nombres && c.nombres.toLowerCase().includes(nom));
        return matchPat && matchMat && matchNom;
      });
      renderEditAreaModal('responsables');
    }

    function draftAgregarColaborador(personal) {
      const colab = DB.colaboradores().find(c => c.personal === personal);
      if (!colab) return;

      const exists = DRAFT_AREA.responsables.find(r => r.personal === personal);
      if (exists) {
        APP.toast({ icon: 'warn', title: 'Ya está asignado', body: `${colab.nombres} ya figura en la lista de responsables de esta área.` });
        return;
      }

      const defaultSede = (DRAFT_AREA.sedes && DRAFT_AREA.sedes.length > 0)
        ? DRAFT_AREA.sedes[0].nombre
        : '7803-2 --> LOCAL 1 / Jr. Larrabure y Unanue 110 Santa Beatriz, Lima';

      DRAFT_AREA.responsables.push({
        id: 'RESP-' + Date.now(),
        personal: colab.personal,
        nombre: `${colab.paterno} ${colab.materno}, ${colab.nombres}`.trim(),
        sede: defaultSede,
        cargo: 'Responsable',
        activo: true
      });

      APP.toast({ icon: 'ok', title: 'Responsable agregado', body: `${colab.paterno} ${colab.materno} fue añadido a la tabla.` });
      renderEditAreaModal('responsables');
    }

    function confirmarQuitarResponsable(idx) {
      syncDraftGeneralFields();
      if (!DRAFT_AREA || !DRAFT_AREA.responsables || !DRAFT_AREA.responsables[idx]) return;
      const r = DRAFT_AREA.responsables[idx];
      mostrarConfirmacionModal({
        titulo: 'Quitar Responsable del Área',
        icono: SVG_ICONS.warn,
        mensaje: `¿Estás seguro de que deseas retirar a <b>«${r.nombre}»</b> (${r.cargo}) del equipo de responsables de esta área?`,
        textoBoton: 'Sí, Quitar Responsable',
        onConfirm: () => {
          DRAFT_AREA.responsables.splice(idx, 1);
          cerrarConfirmacionModal();
          renderEditAreaModal('responsables');
          APP.toast({ icon: 'ok', title: 'Responsable retirado', body: 'Se retiró al colaborador del área.' });
        }
      });
    }

    function draftCambiarResponsable(idx, campo, val) {
      if (DRAFT_AREA.responsables[idx]) {
        DRAFT_AREA.responsables[idx][campo] = (campo === 'activo' ? (val === 'si' || val === true) : val);
      }
    }

    function guardarEdicionArea(id) {
      syncDraftGeneralFields();

      if (!DRAFT_AREA.nombre) {
        APP.toast({ icon: 'warn', title: 'Falta el nombre', body: 'El área debe tener un título o nombre válido.' });
        setSubtabEditArea('general');
        return;
      }

      DB.upsertArea(DRAFT_AREA);
      APP.closeModal();
      APP.toast({ icon: 'ok', title: 'Área actualizada', body: `«${DRAFT_AREA.nombre}» guardada con sedes y responsables.` });
      render();
    }

    // -------------------------------------------------------------------------
    // 4. CONFIRMACIÓN Y ELIMINACIÓN DE ÁREA
    // -------------------------------------------------------------------------
    function eliminarArea(id) {
      const a = DB.getArea(id);
      if (!a) return;

      const tramitesUsan = DB.tramites().filter(t => t.area === a.nombre || (t.proceso && t.proceso.some(p => p.area === a.nombre)));
      const cantUsos = tramitesUsan.length;

      APP.openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="color:var(--warn-fg);display:inline-flex;align-items:center">${SVG_ICONS.warn}</span>
            <h3>Confirmar Eliminación de Área</h3>
          </div>
          <button class="modal-close" onclick="APP.closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="font-size:14px;color:var(--text);margin-bottom:12px">
            ¿Estás seguro de que deseas eliminar permanentemente el área <b>«${a.nombre}»</b> (Código: <code>${a.codigo || a.id}</code>)?
          </p>

          ${cantUsos > 0 ? `
            <div class="alert warn" style="margin-bottom:14px">
              <div style="display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:4px">
                ${SVG_ICONS.warn} Advertencia Institucional:
              </div>
              <div>Esta área se encuentra referenciada en <b>${cantUsos} trámite(s)</b> institucional(es):</div>
              <ul style="margin:6px 0 0 16px;padding:0">
                ${tramitesUsan.slice(0, 3).map(t => `<li>${t.nombre}</li>`).join('')}
                ${cantUsos > 3 ? `<li>... y ${cantUsos - 3} trámite(s) más.</li>` : ''}
              </ul>
              <div style="margin-top:6px;font-size:12px">Eliminarla puede afectar el flujo secuencial de revisión de solicitudes vinculadas.</div>
            </div>
          ` : `
            <div class="alert info" style="margin-bottom:14px">
              Esta área no tiene trámites activos bloqueándola. Se eliminarán sus sedes y equipo de responsables asignados.
            </div>
          `}

          <div style="font-size:12.5px;color:var(--text-muted)">Esta acción no se puede deshacer.</div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="APP.closeModal()">Cancelar</button>
          <button class="btn btn-danger" style="display:inline-flex;align-items:center;gap:6px" onclick="confirmarEliminarArea('${id}')">${SVG_ICONS.trash} Sí, Eliminar definitivamente</button>
        </div>
      `, { wide: false });
    }

    function confirmarEliminarArea(id) {
      const a = DB.getArea(id);
      const nombre = a ? a.nombre : 'Área';
      DB.deleteArea(id);
      APP.closeModal();
      APP.toast({ icon: 'ok', title: 'Área eliminada', body: `«${nombre}» fue retirada del sistema.` });
      render();
    }

    render();
  </script>
</body>
</html>
