<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis documentos · Universidad Norbert Wiener</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    [hidden] {
      display: none !important;
    }

    .chev {
      display: inline-flex;
      transition: transform .18s ease;
      flex-shrink: 0;
    }

    [aria-expanded="true"] .chev {
      transform: rotate(180deg);
    }

    /* ---- Requisitos de certificación (plegable) ---- */
    .req-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .req-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 10px 16px;
      background: none;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-dark);
      text-align: left;
      cursor: pointer;
    }

    .req-toggle:hover {
      background: var(--brand-soft);
    }

    .req-panel {
      padding: 4px 16px 16px 16px;
    }

    .req-panel p {
      margin: 0 0 12px 0;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-soft);
    }

    .req-panel .checklist {
      margin-bottom: 14px;
    }

    /* ---- Acordeón de certificaciones ---- */
    .cert-h {
      margin: 0;
      font: inherit;
    }

    button.cert-accordion-head {
      width: 100%;
      border: none;
      font-family: inherit;
      text-align: left;
      color: inherit;
      flex-wrap: wrap;
    }

    .cert-accordion-head .cert-title-wrap {
      display: block;
      min-width: 0;
    }

    .cert-title {
      display: block;
      font-family: 'Lato', sans-serif;
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .cert-sub {
      display: block;
    }

    .cert-head-right {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .courses-list {
      list-style: none;
      margin: 16px 0;
      padding: 0;
    }

    .courses-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 13.5px;
    }

    .course-name {
      flex: 1 1 220px;
      min-width: 0;
      font-weight: 600;
    }

    .course-name small {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
    }

    .course-code {
      font-weight: 700;
      color: var(--brand-dark);
    }

    .course-side {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .course-grade {
      font-weight: 700;
      color: var(--brand-dark);
      white-space: nowrap;
    }

    .cert-callout {
      background: var(--ok-bg);
      border: 1px solid var(--ok-bd);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .cert-callout-text {
      flex: 1 1 240px;
      min-width: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-soft);
      overflow-wrap: anywhere;
    }

    .cert-callout-text .pill {
      margin-top: 6px;
    }

    /* ---- Tarjeta de documento emitido ---- */
    .doc-card .list-card-head {
      align-items: center;
    }

    .doc-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1 1 260px;
      min-width: 0;
    }

    .doc-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--ok-bg);
      color: var(--ok-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .doc-card .list-card-title {
      overflow-wrap: anywhere;
    }

    .doc-code {
      font-weight: 700;
      color: var(--text-soft);
    }

    .doc-firma {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ok-fg);
      font-weight: 600;
    }

    @media (max-width: 560px) {
      .cert-callout .btn-row,
      .doc-card .btn-row {
        width: 100%;
      }

      .cert-callout .btn-row .btn,
      .doc-card .btn-row .btn {
        flex: 1 1 auto;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/doc.js"></script>
  <script>
    // Un administrativo solo entra aquí en modo "ver como alumno": el shell conserva su sesión
    // y pinta la barra para volver. Esta página no cambia la sesión por su cuenta.
    const sesionInicial = APP.getSession();
    const urlParams = new URLSearchParams(window.location.search);
    const paramCodigo = urlParams.get('codigo') || urlParams.get('alumno');
    let saliendo = false;

    if (sesionInicial && sesionInicial.rol !== 'alumno') {
      saliendo = true;
      APP.verComoAlumno(paramCodigo || '2021100345', 'alumno/mis-documentos.html');
    } else if (sesionInicial && paramCodigo && APP.adminEnEspera() &&
      paramCodigo !== sesionInicial.codigo && paramCodigo !== sesionInicial.id &&
      DB.usuarios().some(u => u.rol === 'alumno' && (u.codigo === paramCodigo || u.id === paramCodigo))) {
      // El administrativo, ya en modo vista, pide ver a otro alumno
      saliendo = true;
      APP.verComoAlumno(paramCodigo, 'alumno/mis-documentos.html');
    }

    const ctx = saliendo ? null : APP.renderShell('mis-documentos');
    const me = ctx ? (DB.getUsuario(ctx.session.id) || ctx.session) : {};
    const perfil = me.perfil || {};
    const E = APP.esc;
    const NOTA_MINIMA = 14;
    let activeTab = 'certificaciones';

    const svg = (inner, size) => `<svg width="${size || 14}" height="${size || 14}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
    const ICO = {
      check: '<polyline points="20 6 9 17 4 12"></polyline>',
      x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
      chev: '<polyline points="6 9 12 15 18 9"></polyline>',
      print: '<polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect>',
      eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>',
      doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>',
      docOk: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><polyline points="9 15 11 17 15 13"></polyline>',
      cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path>',
      gift: '<polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>'
    };

    function enOracion(n) {
      n = String(n || '');
      if (n.length > 3 && n === n.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(n)) {
        n = n.toLowerCase();
        return n.charAt(0).toUpperCase() + n.slice(1);
      }
      return n;
    }

    // ---- Datos ----
    function certsEmitidas() {
      return DB.certificacionesProgresivas().filter(c => DB.certificacionEmitida(me.id, c.id));
    }
    function docsEmitidos() {
      return DB.solicitudes().filter(s => (s.alumnoId === me.id || s.alumnoCodigo === me.codigo) && s.estado === 'Emitido');
    }
    // La fecha de emisión es la del último movimiento "Emitido" del historial
    function fechaEmision(s) {
      const h = (s.historial || []).filter(x => x.estado === 'Emitido').pop();
      return h && h.fecha ? h.fecha : s.fecha;
    }
    function notaDe(c) {
      const hist = me.historialCursos || {};
      const h = hist[c.codigo] || hist[c.nombre];
      if (h && h.nota != null) return Number(h.nota);
      return c.nota != null ? Number(c.nota) : null;
    }

    // ---- Abrir e imprimir ----
    function abrirDocumento(solId) {
      const s = solId ? DB.getSolicitud(solId) : null;
      if (!s) {
        APP.toast({ icon: 'warn', title: 'No encontramos el documento', body: 'Vuelve a cargar la página. Si sigue sin aparecer, escribe a mesadepartes@uwiener.edu.pe.' });
        return false;
      }
      const alumno = DB.getUsuario(s.alumnoId) || me;
      const t = DB.getTramite(s.tramiteId) || { id: s.tramiteId || 'T-010', nombre: s.tramiteNombre, tipo: 'Certificado', modelo: 'certificado' };
      DOC.preview(t, alumno, s);
      return !!DOC.getPlantilla(t).generaDocumento;
    }

    function verDocumento(solId) { abrirDocumento(solId); }

    // Imprimir abre primero el documento: la hoja de impresión solo imprime lo que está en la ventana abierta
    function imprimirDocumento(solId) {
      if (!abrirDocumento(solId)) return;
      setTimeout(() => window.print(), 350);
    }

    function botonesDoc(solId, nombre) {
      const id = E(solId);
      const de = `<span class="sr-only"> ${E(nombre)}</span>`;
      return `
        <div class="btn-row">
          <button class="btn btn-sm" type="button" onclick="imprimirDocumento('${id}')">${svg(ICO.print, 15)} Imprimir${de}</button>
          <button class="btn btn-primary btn-sm" type="button" onclick="verDocumento('${id}')">${svg(ICO.eye, 15)} Ver documento${de}</button>
        </div>`;
    }

    // ---- Plegables: cambian solo su nodo, sin repintar la vista ----
    function togglePlegable(btn) {
      const panel = document.getElementById(btn.getAttribute('aria-controls'));
      const abrir = btn.getAttribute('aria-expanded') !== 'true';
      btn.setAttribute('aria-expanded', String(abrir));
      panel.hidden = !abrir;
    }

    function toggleAccordion(btn) {
      const card = btn.closest('.cert-accordion-card');
      const abrir = !card.classList.contains('is-open');
      card.classList.toggle('is-open', abrir);
      btn.setAttribute('aria-expanded', String(abrir));
    }

    function setTab(tab) {
      activeTab = tab;
      renderTabs(true);
      renderContenido();
    }

    // ---- Requisitos con los valores reales del alumno ----
    function requisitosHTML() {
      const notas = Object.values(me.historialCursos || {}).map(h => Number(h.nota)).filter(n => !isNaN(n));
      const bajas = notas.filter(n => n < NOTA_MINIMA).length;
      const minima = notas.length ? Math.min.apply(null, notas) : null;
      const okNotas = notas.length > 0 && bajas === 0;
      const deuda = !!DB.tieneDeuda(me);
      const montoDeuda = Number(perfil.deuda) || 0;

      const txtNotas = !notas.length
        ? 'Aún no tenemos notas registradas para ti.'
        : okNotas
          ? 'Cumples: tu nota más baja registrada es ' + minima + '.'
          : 'Tienes ' + bajas + (bajas === 1 ? ' curso' : ' cursos') + ' con nota menor a ' + NOTA_MINIMA + '. Solo podrás pedir las certificaciones cuyos cursos tengas con ' + NOTA_MINIMA + ' o más.';
      const txtDeuda = deuda
        ? 'Tienes una deuda pendiente' + (montoDeuda ? ' de ' + APP.money(montoDeuda) : '') + '. Regulariza el pago para poder solicitar.'
        : 'Cumples: estás al día (' + APP.money(0) + ' de deuda).';

      return `
        <section class="req-card" aria-label="Requisitos para certificaciones progresivas">
          <button class="req-toggle" type="button" aria-expanded="false" aria-controls="req-panel" onclick="togglePlegable(this)">
            <span>¿Cómo obtengo una certificación progresiva?</span>
            <span class="chev">${svg(ICO.chev, 16)}</span>
          </button>
          <div class="req-panel" id="req-panel" hidden>
            <p>Para pedir una certificación progresiva necesitas <b>nota mínima de ${NOTA_MINIMA} en todos los cursos</b> del módulo y <b>no tener deuda pendiente</b> en pensiones o aranceles.</p>
            <ul class="checklist">
              <li>
                <span class="check-dot ${okNotas ? 'is-ok' : notas.length ? 'is-warn' : 'is-wait'}">${svg(okNotas ? ICO.check : ICO.x, 12)}</span>
                <span><b>Regla 1: nota mínima ${NOTA_MINIMA}.</b> ${txtNotas}${perfil.promedio != null ? ' Tu promedio ponderado es ' + E(perfil.promedio) + '.' : ''}</span>
              </li>
              <li>
                <span class="check-dot ${deuda ? 'is-err' : 'is-ok'}">${svg(deuda ? ICO.x : ICO.check, 12)}</span>
                <span><b>Regla 2: sin deuda.</b> ${txtDeuda}</span>
              </li>
            </ul>
            <a class="btn btn-sm" href="solicitar.html?tramite=T-010">Solicitar una certificación progresiva</a>
          </div>
        </section>`;
    }

    // ---- Pestaña: certificaciones progresivas ----
    function certificacionesHTML(certs) {
      if (!certs.length) {
        return `
          <div class="empty-state">
            <div class="ico">${svg(ICO.cap, 42)}</div>
            <h3>Aún no tienes certificaciones emitidas</h3>
            <p>Cuando solicites y pagues una certificación progresiva, aparecerá aquí para verla, descargarla o imprimirla cuando quieras.</p>
            <a class="btn btn-primary" href="solicitar.html?tramite=T-010">${svg(ICO.plus, 16)} Solicitar certificación progresiva</a>
          </div>`;
      }

      return certs.map((cert, idx) => {
        const sol = DB.certificacionEmitida(me.id, cert.id);
        const abierto = idx === 0;
        const cid = E(cert.id);
        const cursos = (cert.cursos || []).map(c => {
          const nota = notaDe(c);
          return { codigo: c.codigo || '', nombre: c.nombre, ciclo: c.ciclo || '', nota: nota, cumple: nota != null && nota >= NOTA_MINIMA };
        });
        const notas = cursos.map(c => c.nota).filter(n => n != null);
        const prom = notas.length ? (notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(1) : (cert.promedio != null ? cert.promedio : '-');

        return `
          <div class="cert-accordion-card ${abierto ? 'is-open' : ''}">
            <h3 class="cert-h">
              <button class="cert-accordion-head" type="button" aria-expanded="${abierto}" aria-controls="cert-body-${cid}" onclick="toggleAccordion(this)">
                <span class="cert-accordion-head-left">
                  <span class="cert-doc-icon">${svg(ICO.docOk, 22)}</span>
                  <span class="cert-title-wrap">
                    <span class="cert-title">${E(cert.titulo)}</span>
                    <span class="cert-sub">${E(cert.area || cert.competencia || 'Tecnologías de la Información')} · ${cursos.length} ${cursos.length === 1 ? 'asignatura validada' : 'asignaturas validadas'} · Nota promedio: <b>${E(prom)}</b></span>
                  </span>
                </span>
                <span class="cert-head-right">
                  <span class="pill ok">Emitido · Disponible</span>
                  <span class="cert-accordion-chevron">${svg(ICO.chev, 20)}</span>
                </span>
              </button>
            </h3>

            <div class="cert-accordion-body" id="cert-body-${cid}">
              <ul class="courses-list">
                ${cursos.map(c => `
                  <li>
                    <span class="course-name">
                      ${c.codigo ? `<span class="course-code">[${E(c.codigo)}]</span> ` : ''}${E(enOracion(c.nombre))}
                      ${c.ciclo ? `<small> · Ciclo ${E(c.ciclo)}</small>` : ''}
                    </span>
                    <span class="course-side">
                      <span class="course-grade">${c.nota == null ? 'Sin nota' : 'Nota: ' + Number(c.nota).toFixed(1)}</span>
                      <span class="pill ${c.cumple ? 'ok' : 'err'}">${c.cumple ? 'Cumple el requisito (14 o más)' : 'No cumple el requisito (14 o más)'}</span>
                    </span>
                  </li>`).join('')}
              </ul>

              <div class="cert-callout">
                <div class="cert-callout-text">
                  Certificado oficial emitido con firma digital institucional${sol ? ' el ' + APP.fechaCorta(fechaEmision(sol)) : ''} y enviado a tu correo (<b>${E(me.email)}</b>).
                  ${sol && sol.origen ? `<br><span class="pill info">${svg(ICO.gift, 13)} Emisión masiva institucional gratuita (${E(sol.periodo || 'Cierre de ciclo')})</span>` : ''}
                </div>
                ${sol ? botonesDoc(sol.id, cert.titulo) : ''}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    // ---- Pestaña: todos los documentos emitidos ----
    function todosHTML(docs) {
      if (!docs.length) {
        return `
          <div class="empty-state">
            <div class="ico">${svg(ICO.doc, 40)}</div>
            <h3>Aún no tienes documentos emitidos</h3>
            <p>Los documentos y certificaciones que solicites aparecerán aquí cuando estén listos, y quedarán disponibles siempre.</p>
            <a class="btn btn-primary" href="solicitar.html">Solicitar un trámite</a>
          </div>`;
      }

      return docs.map(s => `
        <article class="list-card doc-card">
          <div class="list-card-head">
            <div class="doc-left">
              <span class="doc-icon">${svg(ICO.doc, 22)}</span>
              <div>
                <h3 class="list-card-title">${E(enOracion(s.tramiteNombre))}</h3>
                <div class="list-card-meta">
                  <span class="doc-code">${E('DOC-' + s.id.replace('S-', ''))}</span>
                  <span>Emitido el ${APP.fechaCorta(fechaEmision(s))}</span>
                  <span class="doc-firma">${svg(ICO.check, 12)} Firma digital institucional</span>
                </div>
              </div>
            </div>
            ${botonesDoc(s.id, s.tramiteNombre)}
          </div>
        </article>`).join('');
    }

    function renderTabs(conFoco) {
      const host = document.getElementById('tabs-host');
      host.innerHTML = APP.tabsHTML([
        { id: 'certificaciones', label: 'Certificaciones progresivas', count: certsEmitidas().length },
        { id: 'todos', label: 'Todos los documentos emitidos', count: docsEmitidos().length }
      ], activeTab, 'setTab');
      const tl = host.querySelector('[role="tablist"]');
      if (tl) tl.setAttribute('aria-label', 'Tipo de documento');
      if (conFoco) {
        const act = host.querySelector('.tab.active');
        if (act) act.focus();
      }
    }

    function renderContenido() {
      document.getElementById('docs-content-area').innerHTML =
        activeTab === 'certificaciones' ? certificacionesHTML(certsEmitidas()) : todosHTML(docsEmitidos());
    }

    function initView() {
      // Por defecto se abre la pestaña que tiene contenido
      activeTab = (!certsEmitidas().length && docsEmitidos().length) ? 'todos' : 'certificaciones';

      ctx.mount.innerHTML = `
        <div class="page-head">
          <div>
            <h1>Mis documentos</h1>
            <p>Aquí están tus certificaciones progresivas, constancias y documentos oficiales ya emitidos con firma digital.</p>
          </div>
          <a class="btn btn-primary" href="solicitar.html">Solicitar un trámite</a>
        </div>

        ${requisitosHTML()}

        <div id="tabs-host"></div>
        <div id="docs-content-area"></div>
      `;
      renderTabs(false);
      renderContenido();
    }

    if (ctx) initView();
  </script>
</body>

</html>
